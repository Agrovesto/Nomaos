# # .github/workflows/secops-fast.yml
# # ─────────────────────────────────────────────────────────────────────────────
# # FAST PIPELINE — Runs on every PR and push.
# # Budget: < 5 minutes.
# # Scope: Build + Unit Tests + Trivy SCA + SonarQube SAST
# #
# # DAST and OWASP Dependency-Check are intentionally excluded here — they
# # are slow by nature and run on their own schedules (see secops-dast.yml
# # and secops-sca-deep.yml).  Results from those workflows are imported into
# # SonarQube asynchronously and surfaced in the next analysis cycle.
# # ─────────────────────────────────────────────────────────────────────────────
