# # .github/workflows/secops-dast.yml
# # ─────────────────────────────────────────────────────────────────────────────
# # DAST — OWASP ZAP API + Baseline scans.
# #
# # Why separate?  ZAP pulls a ~1.1 GB image and runs a spider + active scan —
# # 30–45 min is normal.  Running on every PR blocks developers unnecessarily.
# # We run DAST after pushes to staging/master and on schedule.
# #
# # Parallelism: API scan and baseline scan run in parallel (separate jobs,
# # not a matrix) so total wall-clock time is max(api, web) not api + web.
# #
# # Results are uploaded as "zap-sonar-latest" so the next fast-pipeline
# # run imports them into SonarQube automatically.
# # ─────────────────────────────────────────────────────────────────────────────
# name: "SecOps | DAST (ZAP)"

