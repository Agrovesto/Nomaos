name: CI/CD Deploy Agrovesto.Backend.API
on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build --verbosity normal

  deploy-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_RELEASE }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_RELEASE }} >> ~/.ssh/known_hosts

      - name: Deploy, configure service, Nginx, SSL
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_RELEASE }} << 'EOF'
            set -e

            # --------------------------
            # Variables
            # --------------------------
            APP_NAME="agrovesto-backend"
            RELEASE_DIR="/var/www/Agrovesto.Backend.Release"
            PROD_DIR="/var/www/Agrovesto.Backend.Current"
            SERVICE_FILE="/etc/systemd/system/$APP_NAME.service"
            DOMAIN="release-noma-api.nomaos.com"
            EMAIL="dolapofashina@gmail.com"
            REPO_URL="https://github.com/Agrovesto/Nomaos.git"
            BRANCH="release"

            # --------------------------
            # 1. Directories & code
            # --------------------------
            mkdir -p $RELEASE_DIR $PROD_DIR
            chown -R ubuntu:ubuntu $RELEASE_DIR $PROD_DIR
            cd $RELEASE_DIR

            if [ ! -d ".git" ]; then
              git clone -b $BRANCH $REPO_URL .
            else
              git reset --hard
              git pull origin $BRANCH
            fi

            dotnet restore
            dotnet publish -c Release -o ./publish

            rm -rf $PROD_DIR/*
            cp -r ./publish/* $PROD_DIR/

            # --------------------------
            # 2. Systemd service
            # --------------------------
            if [ ! -f "$SERVICE_FILE" ]; then
              echo "[Unit]
          Description=Agrovesto Backend API
          After=network.target
          
          [Service]
          Type=simple
          WorkingDirectory=$PROD_DIR
          ExecStart=/usr/bin/dotnet $PROD_DIR/Agrovesto.Backend.API.dll
          Restart=always
          RestartSec=5
          User=ubuntu
          Environment=ASPNETCORE_ENVIRONMENT=Production
          
          [Install]
          WantedBy=multi-user.target" | sudo tee $SERVICE_FILE
          
                      sudo systemctl daemon-reload
                      sudo systemctl enable $APP_NAME
                    fi
          
                    sudo systemctl restart $APP_NAME
                    sudo systemctl status $APP_NAME --no-pager
          
                    # --------------------------
                    # 3. Nginx
                    # --------------------------
                    sudo apt-get update
                    sudo apt-get install -y nginx certbot python3-certbot-nginx
          
                    NGINX_CONF="/etc/nginx/sites-available/$DOMAIN"
                    if [ ! -f "$NGINX_CONF" ]; then
                      echo "server {
            listen 80;
            server_name $DOMAIN;
          
            location / {
                proxy_pass http://127.0.0.1:5000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection keep-alive;
                proxy_set_header Host \$host;
                proxy_cache_bypass \$http_upgrade;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
            }
          }" | sudo tee $NGINX_CONF
          
                      sudo ln -sf $NGINX_CONF /etc/nginx/sites-enabled/
                    fi
          
                    sudo nginx -t
                    sudo systemctl restart nginx
          
                    # --------------------------
                    # 4. SSL via Certbot
                    # --------------------------
                    sudo certbot --nginx -d $DOMAIN --non-interactive --agree-tos -m $EMAIL --redirect
                  EOF


