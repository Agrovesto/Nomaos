name: CI - PR Quality + Deploy

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: Agrovesto.Backend.sln
  PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
  SONAR_PROJECT_KEY: Agrovesto.Backend.API
  PUBLISH_DIR: ${{ github.workspace }}/publish
  COMMIT_SHA: ${{ github.sha }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_DETERMINISTIC: true

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # ✅ JOB 1 — PR QUALITY GATE
  # ============================================================
  pr-quality-check:
    name: 🔍 PR Quality Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      test-outcome: ${{ steps.test.outcome }}
      build-outcome: ${{ steps.build.outcome }}
      coverage-pct: ${{ steps.coverage-summary.outputs.line_coverage }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs full git history for accurate blame and PR tracking

      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.423",
              "rollForward": "latestPatch"
            }
          }
          EOF

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔍 Verify SDK version
        run: |
          SDK=$(dotnet --version)
          echo "Active SDK: $SDK"
          [[ "$SDK" == 10.* ]] && echo "❌ SDK 10 active — pin failed" && exit 1 || true

      - name: 🏗️ Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # SonarScanner requires Java 17+

      - name: 💾 Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        id: nuget-cache
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-

      - name: 📦 Restore dependencies
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true

      - name: 🛠️ Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: 🚀 SonarQube Begin Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: 🏗️ Build (Required for Sonar Analysis)
        id: build
        run: |
          START=$(date +%s)

          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            -maxcpucount \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          {
            echo "### 🏗️ Build"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Status | $([ $EXIT_CODE -eq 0 ] && echo '✅ Success' || echo '❌ Failed') |"
            echo "| Duration | $((END - START))s |"
            echo "| Warnings | ⚠️ $(grep -c ': warning ' build.log || true) |"
            echo "| Errors   | ❌ $(grep -c ': error '   build.log || true) |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: 📊 Run tests with coverage
        id: test
        run: |
          START=$(date +%s)

          dotnet test "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            -p:MaxCpuCount=2 \
            2>&1 | tee test.log

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          ELAPSED=$((END - START))

          set +o pipefail
          PASSED=$(grep  -oP 'Passed:\s*\K[0-9]+'  test.log | tail -1); PASSED="${PASSED:-0}"
          FAILED=$(grep  -oP 'Failed:\s*\K[0-9]+'  test.log | tail -1); FAILED="${FAILED:-0}"
          SKIPPED=$(grep -oP 'Skipped:\s*\K[0-9]+' test.log | tail -1); SKIPPED="${SKIPPED:-0}"
          TOTAL=$(grep   -oP 'Total:\s*\K[0-9]+'   test.log | tail -1); TOTAL="${TOTAL:-0}"
          set -o pipefail

          {
            echo "### 🧪 Test Results"
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed   | $PASSED   |"
            echo "| ❌ Failed   | $FAILED   |"
            echo "| ⏭️ Skipped  | $SKIPPED  |"
            echo "| 📊 Total    | $TOTAL    |"
            echo "| ⏱️ Duration | ${ELAPSED}s |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: 🏁 SonarQube End Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: 📊 Parse coverage summary
        id: coverage-summary
        if: always()
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.opencover.xml" | head -1 2>/dev/null || true)

          if [ -z "$COVERAGE_FILE" ]; then
            echo "⚠️ No coverage file found"
            printf 'line_coverage=N/A\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +o pipefail
          LINE_RATE=$(grep   -oP 'sequenceCoverage="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          BRANCH_RATE=$(grep -oP 'branchCoverage="\K[0-9.]+'   "$COVERAGE_FILE" | head -1)
          set -o pipefail

          LINE_RATE="${LINE_RATE:-0}"
          BRANCH_RATE="${BRANCH_RATE:-0}"

          [[ "$LINE_RATE"   =~ ^[0-9]+(\.[0-9]+)?$ ]] || LINE_RATE="0"
          [[ "$BRANCH_RATE" =~ ^[0-9]+(\.[0-9]+)?$ ]] || BRANCH_RATE="0"

          printf 'line_coverage=%s\n' "$LINE_RATE" >> "$GITHUB_OUTPUT"

          {
            echo "### 📊 Code Coverage"
            echo "| Type | Coverage |"
            echo "|------|----------|"
            printf "| 📝 Line/Sequence | %s%% |\n" "$LINE_RATE"
            printf "| 🌿 Branch        | %s%% |\n" "$BRANCH_RATE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-empty: true
          fail-on-error: true

      - name: 📤 Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-reports
          path: |
            TestResults/**/coverage.opencover.xml
            TestResults/**/*.trx
            build.log
            test.log
          retention-days: 7
          if-no-files-found: warn

      - name: ✅ PR Quality Gate Summary
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build.outcome }}"
          TEST_STATUS="${{ steps.test.outcome }}"
          COVERAGE="${{ steps.coverage-summary.outputs.line_coverage }}"

          STATUS_ICON() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          {
            echo "## 🎯 PR Quality Gate Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| 🏗️ Build    | $(STATUS_ICON "$BUILD_STATUS") ${BUILD_STATUS^} |"
            echo "| 🧪 Tests    | $(STATUS_ICON "$TEST_STATUS") ${TEST_STATUS^} |"
            echo "| 📊 Coverage | ${COVERAGE}% |"
          } >> "$GITHUB_STEP_SUMMARY"
