  # =========================================================================
  # PR: Build image + Trivy image scan (NO PUSH)
  # =========================================================================
  validate-image:
    name: 🐳 Build & Scan Image (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image (load only)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.APP_NAME }}:pr-scan
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.APP_NAME }}:pr-scan
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Trivy image scan (JSON report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 0.75.0
          image-ref: ${{ env.APP_NAME }}:pr-scan
          scanners: vuln
          format: json
          output: trivy-image-report.json
          exit-code: "0"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: ignore

  # =========================================================================
  # PUSH to dev: Build & Push image to dev/staging ECR account
  # (No deploy here — staging workflow pulls and deploys)
  # =========================================================================
  build-and-push:
    name: 🚀 Build & Push to ECR (dev/staging account)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: staging
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (dev/staging account)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists (keep last 3)
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null
          fi
          aws ecr put-lifecycle-policy --repository-name "$ECR_REPOSITORY" --lifecycle-policy-text '{
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the last 3 images",
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 3},
              "action": {"type": "expire"}
            }]
          }' >/dev/null

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

      - name: Build metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          safe() { printf '%s' "$1" | tr -c 'A-Za-z0-9._/@+,-' '_'; }

          SHORT_SHA="${GITHUB_SHA::12}"
          VERSION=$(git describe --tags --always 2>/dev/null || echo "$SHORT_SHA")

          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)
          PR_AUTHOR=""; PR_APPROVERS=""
          if [ -n "$PR_NUMBER" ]; then
            PR_AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.user.login' 2>/dev/null || true)
            PR_APPROVERS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
              --jq '.[] | select(.state=="APPROVED") | .user.login' 2>/dev/null \
              | sort -u | paste -sd, - || true)
          fi

          {
            echo "short_sha=${SHORT_SHA}"
            echo "image=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(safe "$VERSION")"
            echo "branch=$(safe "$GITHUB_REF_NAME")"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "actor=$(safe "$GITHUB_ACTOR")"
            echo "pr_number=$(safe "$PR_NUMBER")"
            echo "pr_author=$(safe "$PR_AUTHOR")"
            echo "pr_approvers=$(safe "$PR_APPROVERS")"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build, tag, and push image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:dev-latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
            GIT_BRANCH=${{ steps.meta.outputs.branch }}
            BUILD_RUN_URL=${{ steps.meta.outputs.run_url }}
            BUILD_ACTOR=${{ steps.meta.outputs.actor }}
            PR_NUMBER=${{ steps.meta.outputs.pr_number }}
            PR_AUTHOR=${{ steps.meta.outputs.pr_author }}
            PR_APPROVERS=${{ steps.meta.outputs.pr_approvers }}
          provenance: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Trivy scan on pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          scanners: vuln
          format: table
          exit-code: "0"
          severity: "HIGH,CRITICAL"

      - name: Summary
        run: |
          {
            echo "## ✅ Image Pushed to dev/staging ECR"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`${{ steps.meta.outputs.image }}\` |"
            echo "| SHA tag | \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| Also tagged | \`dev-latest\` |"
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Built at | ${{ steps.meta.outputs.built_at }} |"
          } >> "$GITHUB_STEP_SUMMARY"