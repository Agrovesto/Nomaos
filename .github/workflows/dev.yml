name: Build & Deploy API (Smart & Safe)

on:
  pull_request:
    branches: [dev, staging]
  push:
    branches: [staging]

jobs:
  # ──────────────────────────────────────────────────────
  # 1. Build & Publish Artifact (runs on PR + push)
  # ──────────────────────────────────────────────────────
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: app-publish-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build & Publish
        run: |
          dotnet publish Agrovesto.Backend.API/Agrovesto.Backend.API.csproj \
            -c Release \
            -o ./publish \
            --no-restore \
            /p:UseAppHost=false \
            /p:PublishTrimmed=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish-${{ github.sha }}
          path: ./publish
          retention-days: 1

  # ──────────────────────────────────────────────────────
  # 2. Deploy to Server (ONLY on push to staging)
  # ──────────────────────────────────────────────────────
  deploy-to-staging:
    needs: build-and-publish
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish-${{ github.sha }}
          path: ./publish

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_STAGING }}

      - name: Add Host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST_STAGING }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 (Zero-downtime style)
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no \
            ./publish/ ubuntu@${{ secrets.EC2_HOST_STAGING }}:/var/www/Agrovesto.API/publish/

          ssh ubuntu@${{ secrets.EC2_HOST_STAGING }} "
            sudo systemctl restart Agrovesto.Backend.API.service &&
            sudo systemctl status Agrovesto.Backend.API.service --no-pager
          "

      - name: Health Check (optional but recommended)
        run: |
          sleep 8
          curl -f https://${{ secrets.EC2_HOST_STAGING }}/health || \
          curl -f http://${{ secrets.EC2_HOST_STAGING }}:5000/health || exit 1
