name: Dev - Scan, Test, Build & Push

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: "dev-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: agrovesto-dev-nomaos
  APP_NAME: nomaos-api
  DOTNET_VERSION: 8.0.x
  DOTNET_SDK_VERSION: 8.0.423
  SOLUTION_PATH: Agrovesto.Backend.sln
  TEST_PROJECT: NomaOS.Test/NomaOS.Test.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:

  # =========================================================================
  # PR: Secret scanning + filesystem vulnerability/misconfig scan
  # =========================================================================
  secret-and-fs-scan:
    name: 🔒 Secret & Filesystem Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          extra_args: --only-verified

      - name: Trivy repo scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  # =========================================================================
  # PR: IaC scan (Checkov)
  # =========================================================================
  iac-scan:
    name: 🧱 Checkov IaC Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,github_actions,terraform,kubernetes
          soft_fail: false
          quiet: true
          output_format: cli

  # =========================================================================
  # PR: Dependency vulnerability check
  # =========================================================================
  dependency-check:
    name: 📦 Dependency Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"


      - name: Audit NuGet vulnerabilities and show upgrade candidates
        shell: bash
        run: |
            set +e

            # 1. Find vulnerable direct and transitive packages.
            VULN_OUTPUT=$(dotnet list "$SOLUTION_PATH" package \
            --vulnerable --include-transitive 2>&1)
            VULN_EXIT=$?

            echo "========== VULNERABLE NUGET PACKAGES =========="
            printf '%s\n' "$VULN_OUTPUT"

            # Stop if the vulnerability scan itself failed.
            if [ "$VULN_EXIT" -ne 0 ]; then
            echo "::error::NuGet vulnerability scan command failed."
            exit "$VULN_EXIT"
            fi

            # 2. Find available upgrades separately.
            UPDATE_OUTPUT=$(dotnet list "$SOLUTION_PATH" package \
            --outdated --include-transitive 2>&1)
            UPDATE_EXIT=$?

            echo ""
            echo "========== AVAILABLE UPGRADE CANDIDATES =========="
            printf '%s\n' "$UPDATE_OUTPUT"

            if [ "$UPDATE_EXIT" -ne 0 ]; then
            echo "::warning::Could not retrieve package upgrade candidates."
            fi

            # 3. Publish both reports in the GitHub Actions Summary.
            {
            echo "## NuGet Security Audit"
            echo ""
            echo "### Vulnerable Packages"
            echo '```text'
            printf '%s\n' "$VULN_OUTPUT"
            echo '```'
            echo ""
            echo "### Available Upgrade Candidates"
            echo "These are available updates, not guaranteed security fixes."
            echo '```text'
            printf '%s\n' "$UPDATE_OUTPUT"
            echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # 4. Keep the security gate enforced.
            if printf '%s\n' "$VULN_OUTPUT" |
            grep -qiE '(^|[[:space:]])(High|Critical)([[:space:]]|$)'; then
            echo "::error::High/Critical vulnerable NuGet packages detected. Review the upgrade candidates and advisory URLs above."
            exit 1
            fi

            echo "No High/Critical NuGet findings detected."
        continue-on-error: true


