name: CI/CD Deploy Agrovesto.Backend.API
on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build application
        run: dotnet build -c Release --no-restore
      
      - name: Publish application
        run: dotnet publish -c Release -r linux-x64 --self-contained true /p:PublishTrimmed=false -o ./publish
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish

          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
  
    steps:
      - uses: actions/checkout@v4.3.1
  
      # -------------------------------
      # SSH Agent
      # -------------------------------
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}
  
      # -------------------------------
      # Add keep-alive (prevents broken pipe)
      # -------------------------------
      - name: Configure SSH keepalive
        run: |
          echo "ServerAliveInterval 60" >> ~/.ssh/config
          echo "ServerAliveCountMax 60" >> ~/.ssh/config
          echo "TCPKeepAlive yes" >> ~/.ssh/config
  
      # -------------------------------
      # Add EC2 host to known_hosts
      # -------------------------------
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_DEV }} >> ~/.ssh/known_hosts
  
      # -------------------------------
      # Copy repo to EC2 (hardened rsync)
      # -------------------------------
      - name: Copy repo to EC2
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=60 ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "sudo mkdir -p /var/www/Agrovesto.Backend.API && sudo chown -R ubuntu:ubuntu /var/www/Agrovesto.Backend.API"
  
          rsync -avz --delete \
            -e "ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=60" \
            --exclude='.git' \
            ./ ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Agrovesto.Backend.API/
  
      # -------------------------------
      # Execute deployment script (SSH keepalive included)
      # -------------------------------
      - name: Execute deployment script
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=60 \
              ubuntu@${{ secrets.EC2_HOST_DEV }} \
              "sudo bash /var/www/Agrovesto.Backend.API/deploy.sh"


