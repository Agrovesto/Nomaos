name: CI/CD Deploy Agrovesto.Backend.API

on:
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP: Agrovesto.Backend.API
      PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
      PUBLISH_DIR: ${{ github.workspace }}/publish
      COMMIT_SHA: ${{ github.sha }}
      SONAR_PROJECT_KEY: Agrovesto.Backend.API

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Setup .NET ───────────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # ── Install jq (needed for Quality Gate check) ───────────────────
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # ── Clean ─────────────────────────────────────────────────────────
      - name: Clean
        run: |
          dotnet clean ${{ env.PROJECT_PATH }} --configuration Release || true
          rm -rf ${{ env.PROJECT_PATH }}/../obj
          rm -rf ${{ env.PROJECT_PATH }}/../bin

      # ── Cache NuGet ───────────────────────────────────────────────────
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}-${{ github.run_id }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # ── Install SonarScanner ──────────────────────────────────────────
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # ── SonarQube Begin ───────────────────────────────────────────────
      - name: SonarQube Begin
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      # ── Build (required between begin/end) ────────────────────────────
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      # ── SonarQube End ─────────────────────────────────────────────────
      - name: SonarQube End
        run: |
          dotnet sonarscanner end \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      # ── Wait for Quality Gate ─────────────────────────────────────────
      - name: Wait for Quality Gate
        run: |
          echo "Waiting for SonarQube Quality Gate..."

          STATUS="PENDING"
          ATTEMPTS=0

          while [[ "$STATUS" == "PENDING" || "$STATUS" == "IN_PROGRESS" || -z "$STATUS" ]]; do
            sleep 5
            STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
              "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=${{ env.SONAR_PROJECT_KEY }}" \
              | jq -r '.projectStatus.status')

            echo "Current status: $STATUS"
            ATTEMPTS=$((ATTEMPTS+1))

            if [ $ATTEMPTS -gt 30 ]; then
              echo "Timeout waiting for Quality Gate"
              exit 1
            fi
          done

          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate failed ❌"
            exit 1
          fi

          echo "Quality Gate passed ✅"

      # ── Publish ───────────────────────────────────────────────────────
      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -f net8.0 \
            --no-restore \
            -o ${{ env.PUBLISH_DIR }}

      # ── Setup SSH Agent ───────────────────────────────────────────────
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_DEV }} >> ~/.ssh/known_hosts

      # ── Rsync to EC2 ──────────────────────────────────────────────────
      - name: Rsync artifact to EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"

          rsync -az --delete \
            --checksum \
            ${{ env.PUBLISH_DIR }}/ \
            ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/

      # ── Swap slot ─────────────────────────────────────────────────────
      - name: Swap slot
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ubuntu@${{ secrets.EC2_HOST_DEV }} \
              "bash /var/www/Nomaos/deploy-staging.sh ${{ env.COMMIT_SHA }}"

      # ── Deployment Summary ────────────────────────────────────────────
      - name: Write deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ env.COMMIT_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY