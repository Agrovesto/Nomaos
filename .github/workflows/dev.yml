name: CI/CD Deploy Agrovesto.Backend.API
on:
  push:
    branches:
      - staging
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}
          
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_DEV }} >> ~/.ssh/known_hosts
          
      - name: Trigger Blue/Green Deployment
        run: |
          ssh -tt ubuntu@${{ secrets.EC2_HOST_DEV }} \
          'bash  /var/www/Nomaos/deploy-staging.sh'
