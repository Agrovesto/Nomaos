name: CI - PR Quality + Deploy

on:
  pull_request:
    branches: [dev]

  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# GITHUB TOKEN PERMISSIONS
# ============================================================
permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: 8.0.x
  DOTNET_SDK_VERSION: 8.0.423
  SOLUTION_PATH: Agrovesto.Backend.sln
  PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
  SONAR_PROJECT_KEY: Agrovesto.Backend.API
  PUBLISH_DIR: ${{ github.workspace }}/publish
  COMMIT_SHA: ${{ github.sha }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_DETERMINISTIC: true

defaults:
  run:
    shell: bash


# ==============================================================
# JOB 1 — PR QUALITY GATE
# ==============================================================

jobs:

  pr-quality-check:
    name: 🔍 PR Quality Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      test-outcome: ${{ steps.test.outcome }}
      build-outcome: ${{ steps.build.outcome }}
      coverage-pct: ${{ steps.coverage-summary.outputs.line_coverage }}

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # =========================================================
      # PIN .NET SDK
      # =========================================================
      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << EOF
          {
            "sdk": {
              "version": "${{ env.DOTNET_SDK_VERSION }}",
              "rollForward": "latestPatch"
            }
          }
          EOF
          echo "===== global.json ====="
          cat global.json
      # =========================================================
      # SETUP .NET
      # =========================================================
      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # =========================================================
      # VERIFY SDK
      # =========================================================
      - name: 🔍 Verify SDK version
        run: |
          SDK=$(dotnet --version)
          echo "Active SDK: $SDK"
          if [[ "$SDK" != 8.* ]]; then
            echo "❌ Expected .NET 8 SDK"
            exit 1
          fi
      # =========================================================
      # JAVA FOR SONARQUBE
      # ========================================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      # =========================================================
      # CACHE NUGET
      # =========================================================
      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: >
            nuget-${{ runner.os }}-
            dotnet-${{ env.DOTNET_SDK_VERSION }}-
            ${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet-${{ env.DOTNET_SDK_VERSION }}-
            nuget-${{ runner.os }}-
      # =========================================================
      # CACHE SONAR
      # =========================================================
      - name: 💾 Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-7.1.0
          restore-keys: |
            sonar-${{ runner.os }}-
      # =========================================================
      # CACHE .NET TOOLS
      # =========================================================
      - name: 💾 Cache .NET tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: >
            dotnet-tools-${{ runner.os }}-
            ${{ hashFiles('**/.config/dotnet-tools.json') }}
          restore-keys: |
            dotnet-tools-${{ runner.os }}-
      # =========================================================
      # RESTORE
      # =========================================================
      - name: 📦 Restore dependencies
        run: |
          dotnet restore \
            "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true
      # =========================================================
      # INSTALL SONARSCANNER
      # =========================================================
      - name: 🛠️ Install SonarScanner
        run: |
          if dotnet tool list --global | grep -q "dotnet-sonarscanner"; then
            echo "✅ SonarScanner already available"
          else
            dotnet tool install \
              --global \
              dotnet-sonarscanner \
              --version 7.1.0
          fi
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # =========================================================
      # SONAR BEGIN
      # =========================================================
      - name: 🔍 SonarQube — Begin
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/obj/**,**/bin/**,**/*.css,**/*.js" \
            /d:sonar.coverage.exclusions="**/*Tests/**,**/*.Tests/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.test.inclusions="**/*Tests/**,**/*.Tests/**"
      # =========================================================
      # BUILD
      # =========================================================
      - name: 🏗️ Build
        id: build
        run: |
          START=$(date +%s)
          dotnet build \
            "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            -maxcpucount \
            2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          {
            echo "### 🏗️ Build"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Status | $([ "$EXIT_CODE" -eq 0 ] && echo '✅ Success' || echo '❌ Failed') |"
            echo "| Duration | $((END - START))s |"
            echo "| Warnings | ⚠️ $(grep -c ': warning ' build.log || true) |"
            echo "| Errors | ❌ $(grep -c ': error ' build.log || true) |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"

      # =========================================================
      # TEST + COVERAGE
      # =========================================================
      - name: 🧪 Run tests with coverage
        id: test
        run: |
          START=$(date +%s)
          dotnet test \
            "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            -p:MaxCpuCount=2 \
            2>&1 | tee test.log
          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          ELAPSED=$((END - START))
          set +o pipefail
          PASSED=$(
            grep -oP 'Passed:\s*\K[0-9]+' test.log |
            tail -1
          )
          FAILED=$(
            grep -oP 'Failed:\s*\K[0-9]+' test.log |
            tail -1
          )
          SKIPPED=$(
            grep -oP 'Skipped:\s*\K[0-9]+' test.log |
            tail -1
          )
          TOTAL=$(
            grep -oP 'Total:\s*\K[0-9]+' test.log |
            tail -1
          )
          PASSED="${PASSED:-0}"
          FAILED="${FAILED:-0}"
          SKIPPED="${SKIPPED:-0}"
          TOTAL="${TOTAL:-0}"
          set -o pipefail
          {
            echo "### 🧪 Test Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed | $PASSED |"
            echo "| ❌ Failed | $FAILED |"
            echo "| ⏭️ Skipped | $SKIPPED |"
            echo "| 📊 Total | $TOTAL |"
            echo "| ⏱️ Duration | ${ELAPSED}s |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$EXIT_CODE"


      # =========================================================
      # SONAR END
      # =========================================================

      - name: 🏁 SonarQube — End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${SONAR_TOKEN}"


      # =========================================================
      # COVERAGE SUMMARY
      # =========================================================

      - name: 📊 Parse coverage summary
        id: coverage-summary
        if: always()
        run: |
          COVERAGE_FILE=$(
            find ./TestResults \
              -name "coverage.opencover.xml" \
              | head -1 2>/dev/null || true
          )

          if [ -z "$COVERAGE_FILE" ]; then
            echo "⚠️ No coverage file found"

            printf 'line_coverage=N/A\n' \
              >> "$GITHUB_OUTPUT"

            exit 0
          fi

          set +o pipefail

          LINE_RATE=$(
            grep \
              -oP 'sequenceCoverage="\K[0-9.]+' \
              "$COVERAGE_FILE" |
            head -1
          )

          BRANCH_RATE=$(
            grep \
              -oP 'branchCoverage="\K[0-9.]+' \
              "$COVERAGE_FILE" |
            head -1
          )

          set -o pipefail

          LINE_RATE="${LINE_RATE:-0}"
          BRANCH_RATE="${BRANCH_RATE:-0}"

          [[ "$LINE_RATE" =~ ^[0-9]+(\.[0-9]+)?$ ]] \
            || LINE_RATE="0"

          [[ "$BRANCH_RATE" =~ ^[0-9]+(\.[0-9]+)?$ ]] \
            || BRANCH_RATE="0"

          printf 'line_coverage=%s\n' "$LINE_RATE" \
            >> "$GITHUB_OUTPUT"

          {
            echo "### 📊 Code Coverage"
            echo ""
            echo "| Type | Coverage |"
            echo "|------|----------|"
            printf "| 📝 Line/Sequence | %s%% |\n" "$LINE_RATE"
            printf "| 🌿 Branch | %s%% |\n" "$BRANCH_RATE"
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # TEST REPORT
      # =========================================================

      - name: 📝 Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-empty: true
          fail-on-error: true
      # =========================================================
      # PR SUMMARY
      # =========================================================

      - name: ✅ PR Quality Gate Summary
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build.outcome }}"
          TEST_STATUS="${{ steps.test.outcome }}"
          COVERAGE="${{ steps.coverage-summary.outputs.line_coverage }}"

          STATUS_ICON() {
            [ "$1" = "success" ] &&
              echo "✅" ||
              echo "❌"
          }

          {
            echo "## 🎯 PR Quality Gate Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| 🏗️ Build | $(STATUS_ICON "$BUILD_STATUS") ${BUILD_STATUS^} |"
            echo "| 🧪 Tests | $(STATUS_ICON "$TEST_STATUS") ${TEST_STATUS^} |"
            echo "| 📊 Coverage | ${COVERAGE}% |"
            echo ""
            echo "> PR #${{ github.event.pull_request.number }}"
            echo "> Commit \`${{ env.COMMIT_SHA }}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ==============================================================
  # JOB 2 — DEV BUILD + SONAR + DEPLOY
  # ==============================================================
  deploy-dev:
    name: 🚀 Build + Sonar + Deploy to Dev

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment:
      name: dev
      url: https://dev-noma-api.nomaos.com/health

    outputs:
      quality-gate: ${{ steps.quality-gate.outputs.status }}
      version: ${{ steps.version.outputs.value }}

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # PIN SDK
      # =========================================================

      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << EOF
          {
            "sdk": {
              "version": "${{ env.DOTNET_SDK_VERSION }}",
              "rollForward": "latestPatch"
            }
          }
          EOF

          echo "===== global.json ====="
          cat global.json


      # =========================================================
      # SETUP .NET
      # =========================================================

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}


      # =========================================================
      # VERIFY SDK
      # =========================================================

      - name: 🔍 Verify SDK
        run: |
          SDK=$(dotnet --version)

          echo "Active SDK: $SDK"

          if [[ "$SDK" != 8.* ]]; then
            echo "❌ Expected .NET 8 SDK"
            exit 1
          fi


      # =========================================================
      # JAVA
      # =========================================================

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'


      # =========================================================
      # CACHE NUGET
      #
      # This is the most important performance optimization.
      #
      # We persist the dependency cache, NOT the application.
      # ==============================================================

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages

          key: >
            nuget-${{ runner.os }}-
            dotnet-${{ env.DOTNET_SDK_VERSION }}-
            ${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}

          restore-keys: |
            nuget-${{ runner.os }}-dotnet-${{ env.DOTNET_SDK_VERSION }}-
            nuget-${{ runner.os }}-


      # =========================================================
      # CACHE SONARQUBE
      # =========================================================

      - name: 💾 Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache

          key: sonar-${{ runner.os }}-7.1.0

          restore-keys: |
            sonar-${{ runner.os }}-


      # =========================================================
      # CACHE .NET TOOLS
      # =========================================================

      - name: 💾 Cache .NET tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools

          key: >
            dotnet-tools-${{ runner.os }}-
            ${{ hashFiles('**/.config/dotnet-tools.json') }}

          restore-keys: |
            dotnet-tools-${{ runner.os }}-


      # =========================================================
      # RESTORE
      # =========================================================

      - name: 📦 Restore dependencies
        run: |
          dotnet restore \
            "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true


      # =========================================================
      # INSTALL SONARSCANNER
      # =========================================================

      - name: 🛠️ Install SonarScanner
        run: |
          if dotnet tool list --global | grep -q "dotnet-sonarscanner"; then
            echo "✅ SonarScanner already available"
          else
            dotnet tool install \
              --global \
              dotnet-sonarscanner \
              --version 7.1.0
          fi

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"


      # =========================================================
      # VERSION
      # =========================================================

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(
            grep \
              -oPm1 '(?<=<Version>)[^<]+' \
              "${{ env.PROJECT_PATH }}" \
              2>/dev/null ||
              true
          )

          VERSION="${VERSION:-1.0.${{ github.run_number }}}"

          echo "value=$VERSION" \
            >> "$GITHUB_OUTPUT"

          echo "📦 Version: $VERSION"


      # =========================================================
      # SONAR BEGIN
      # =========================================================

      - name: 🔍 SonarQube — Begin
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /v:"${{ steps.version.outputs.value }}" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/obj/**,**/bin/**,**/*.css,**/*.js" \
            /d:sonar.coverage.exclusions="**/*Tests/**,**/*.Tests/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.test.inclusions="**/*Tests/**,**/*.Tests/**"


      # =========================================================
      # BUILD
      # =========================================================

      - name: 🏗️ Build
        id: build
        run: |
          START=$(date +%s)

          dotnet build \
            "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            -maxcpucount \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          END=$(date +%s)

          {
            echo "### 🏗️ Build"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Status | $([ "$EXIT_CODE" -eq 0 ] && echo '✅ Success' || echo '❌ Failed') |"
            echo "| Duration | $((END - START))s |"
            echo "| Warnings | ⚠️ $(grep -c ': warning ' build.log || true) |"
            echo "| Errors | ❌ $(grep -c ': error ' build.log || true) |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$EXIT_CODE"


      # =========================================================
      # TEST
      # =========================================================

      - name: 🧪 Test with coverage
        id: test
        run: |
          START=$(date +%s)

          dotnet test \
            "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            -p:MaxCpuCount=2

          EXIT_CODE=$?

          END=$(date +%s)

          echo "Tests completed in $((END - START))s"

          exit "$EXIT_CODE"


      # =========================================================
      # SONAR END
      # =========================================================

      - name: 🔍 SonarQube — End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${SONAR_TOKEN}"


      # =========================================================
      # SONAR QUALITY GATE
      # =========================================================

      - name: 🎯 Quality Gate check
        id: quality-gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |

          REPORT=".sonarqube/out/.sonar/report-task.txt"

          if [ ! -f "$REPORT" ]; then
            echo "❌ report-task.txt missing"
            exit 1
          fi


          ANALYSIS_ID=$(
            grep \
              -oP 'ceTaskId=\K.*' \
              "$REPORT"
          )

          echo "📋 Task ID: $ANALYSIS_ID"


          TASK_COMPLETED=false


          for i in $(seq 1 30); do

            RESP=$(
              curl \
                -sf \
                --max-time 10 \
                -u "${SONAR_TOKEN}:" \
                "${SONAR_HOST_URL}/api/ce/task?id=${ANALYSIS_ID}"
            )

            STATUS=$(
              echo "$RESP" |
              jq -r '.task.status'
            )

            echo "[$i/30] $STATUS"


            case "$STATUS" in

              SUCCESS)
                TASK_COMPLETED=true
                break
                ;;

              FAILED|CANCELED)
                echo "❌ Sonar task $STATUS"
                exit 1
                ;;

              *)
                sleep $(
                  (
                    i < 4
                  ) && echo 5 ||
                  (
                    i < 8
                  ) && echo 10 ||
                  echo 15
                )
                ;;

            esac

          done


          if [ "$TASK_COMPLETED" != "true" ]; then
            echo "❌ Sonar analysis timed out"
            exit 1
          fi


          QG=$(
            curl \
              -sf \
              --max-time 10 \
              -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}"
          )


          QG_STATUS=$(
            echo "$QG" |
            jq -r '.projectStatus.status'
          )


          echo "status=$QG_STATUS" \
            >> "$GITHUB_OUTPUT"


          {
            echo "### 🎯 Quality Gate: $QG_STATUS"
            echo ""
            echo "| Metric | Actual | Threshold | Status |"
            echo "|--------|--------|-----------|--------|"

            echo "$QG" |
              jq -r '
                .projectStatus.conditions[] |
                "| \(.metricKey) | \(.actualValue // "N/A") | \(.errorThreshold // "N/A") | \(if .status == "OK" then "✅" else "❌" end) |"
              '
          } >> "$GITHUB_STEP_SUMMARY"


          if [ "$QG_STATUS" != "OK" ]; then
            echo "❌ Quality Gate FAILED"
            exit 1
          fi


          echo "✅ Quality Gate passed!"


      # =========================================================
      # PUBLISH APPLICATION
      #
      # THIS STAYS ON THE SAME RUNNER.
      #
      # Nothing goes to GitHub artifact storage.
      # =========================================================

      - name: 🚀 Publish application
        id: publish
        run: |

          START=$(date +%s)

          rm -rf "${{ env.PUBLISH_DIR }}"

          dotnet publish \
            "${{ env.PROJECT_PATH }}" \
            --configuration Release \
            --runtime linux-x64 \
            --framework net8.0 \
            --self-contained true \
            --output "${{ env.PUBLISH_DIR }}" \
            --verbosity quiet \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -maxcpucount


          END=$(date +%s)

          SIZE=$(
            du -sh "${{ env.PUBLISH_DIR }}" |
            cut -f1
          )


          {
            echo "### 🚀 Publish"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ✅ Status | Success |"
            echo "| 📦 Size | $SIZE |"
            echo "| 📁 Files | $(find "${{ env.PUBLISH_DIR }}" -type f | wc -l | tr -d ' ') |"
            echo "| ⏱️ Duration | $((END - START))s |"
            echo "| 🏷️ Version | ${{ steps.version.outputs.value }} |"
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # WRITE DEPLOYMENT METADATA
      # =========================================================

      - name: 🏷️ Write deployment metadata
        run: |

          echo "${{ env.COMMIT_SHA }}" \
            > "${{ env.PUBLISH_DIR }}/.commit-sha"

          echo "${{ steps.version.outputs.value }}" \
            > "${{ env.PUBLISH_DIR }}/.version"

          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > "${{ env.PUBLISH_DIR }}/.deployed-at"


          echo "===== Metadata ====="

          ls -la \
            "${{ env.PUBLISH_DIR }}/.commit-sha" \
            "${{ env.PUBLISH_DIR }}/.version" \
            "${{ env.PUBLISH_DIR }}/.deployed-at"

          echo ""
          echo "===== SHA ====="

          cat "${{ env.PUBLISH_DIR }}/.commit-sha"


      # =========================================================
      # SSH AGENT
      # =========================================================

      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}


      # =========================================================
      # TRUST EC2
      # =========================================================

      - name: 🔐 Trust EC2 host
        run: |

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          ssh-keyscan -H \
            "${{ secrets.EC2_HOST_DEV }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # =========================================================
      # CREATE RELEASE DIRECTORY
      # =========================================================

      - name: 📁 Prepare release directory
        run: |

          ssh \
            -o ConnectTimeout=10 \
            ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"


      # =========================================================
      # RSYNC DIRECTLY TO DEV EC2
      #
      # The publish directory is copied directly from the current
      # runner to EC2.
      #
      # NO GitHub artifact.
      # =========================================================

      - name: 📡 Sync application to Dev EC2
        id: rsync
        run: |

          START=$(date +%s)


          rsync \
            -az \
            --delete \
            --exclude='.git' \
            --exclude='*.pdb' \
            --exclude='*.xml' \
            --timeout=30 \
            --stats \
            "${{ env.PUBLISH_DIR }}/" \
            "ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/" \
            2>&1 | tee rsync.log


          EXIT_CODE=${PIPESTATUS[0]}


          END=$(date +%s)


          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Rsync failed"
            exit "$EXIT_CODE"
          fi


          TRANSFERRED=$(
            grep \
              "Total transferred file size" \
              rsync.log |
            awk '{print $5, $6}' ||
            echo "N/A"
          )


          {
            echo "### 📡 File Transfer"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ✅ Status | Success |"
            echo "| 📦 Transferred | $TRANSFERRED |"
            echo "| ⏱️ Duration | $((END - START))s |"
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # VERIFY REMOTE SHA
      # =========================================================

      - name: 🔎 Verify application on server
        run: |

          REMOTE_SHA=$(
            ssh \
              -o ConnectTimeout=10 \
              ubuntu@${{ secrets.EC2_HOST_DEV }} \
              "cat /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/.commit-sha 2>/dev/null | tr -d '[:space:]' || echo NOT_FOUND"
          )


          echo "Expected SHA: ${{ env.COMMIT_SHA }}"
          echo "Remote SHA:   $REMOTE_SHA"


          if [ "$REMOTE_SHA" != "${{ env.COMMIT_SHA }}" ]; then

            echo "❌ Remote SHA mismatch"

            echo "===== Remote directory ====="

            ssh \
              ubuntu@${{ secrets.EC2_HOST_DEV }} \
              "ls -la /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/"

            exit 1
          fi


          echo "✅ Remote SHA verified: $REMOTE_SHA"


      # =========================================================
      # DEPLOY
      # =========================================================

      - name: 🔄 Swap deployment slot
        run: |

          ssh \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o ConnectTimeout=10 \
            ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "bash /var/www/Nomaos/deploy-staging.sh ${{ env.COMMIT_SHA }}"


          echo "✅ Slot swap complete"


      # =========================================================
      # HEALTH CHECK
      # =========================================================

      - name: ❤️ Health check
        id: health
        run: |

          echo "⏳ Waiting 15 seconds for service to stabilise..."

          sleep 15


          for i in $(seq 1 10); do

            HTTP_CODE=$(
              curl \
                -s \
                -o /dev/null \
                -w "%{http_code}" \
                --max-time 5 \
                https://dev-noma-api.nomaos.com/health ||
              echo "000"
            )


            if [ "$HTTP_CODE" = "200" ]; then

              echo "✅ Healthy (attempt $i) — HTTP $HTTP_CODE"

              printf 'health_status=healthy\n' \
                >> "$GITHUB_OUTPUT"

              exit 0

            fi


            echo "[$i/10] HTTP $HTTP_CODE — retrying in 10s..."

            sleep 10

          done


          printf 'health_status=unhealthy\n' \
            >> "$GITHUB_OUTPUT"


          echo "❌ Health check failed after 10 attempts"

          exit 1
        continue-on-error: true


      # =========================================================
      # DEPLOYMENT SUMMARY
      # =========================================================

      - name: 📋 Deployment Summary
        if: always()
        env:
          HEALTH: ${{ steps.health.outputs.health_status }}
          VERSION: ${{ steps.version.outputs.value }}
          QG: ${{ steps.quality-gate.outputs.status }}
        run: |

          HEALTH_ICON=$(
            [ "$HEALTH" = "healthy" ] &&
              echo "✅" ||
              echo "❌"
          )


          {
            echo "## 🚀 Dev Deployment Summary"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| 📦 Version | \`$VERSION\` |"
            echo "| 🔖 Commit | \`${{ env.COMMIT_SHA }}\` |"
            echo "| 🌍 Environment | \`dev\` |"
            echo "| 🎯 Quality Gate | $QG |"
            echo "| $HEALTH_ICON Health | ${HEALTH:-unknown} |"
            echo "| 🕐 Deployed At | \`$(date -u +"%Y-%m-%dT%H:%M:%SZ")\` |"
            echo "| 🔗 URL | https://dev-noma-api.nomaos.com/health |"
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # CLEAN LOCAL FILES
      # =========================================================

      - name: 🧹 Clean runner
        if: always()
        run: |

          rm -rf "${{ env.PUBLISH_DIR }}"
          rm -rf ./TestResults
          rm -rf ./.sonarqube

          echo "✅ Local build files cleaned"