name: CI - PR Quality + Deploy

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # ✅ JOB 1 — BUILD & TEST ON PR (NO SONAR - Community doesn't support PR decoration)
  # ============================================================
  pr-quality-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
      TEST_PROJECT_PATH: Agrovesto.Backend.Tests/Agrovesto.Backend.Tests.csproj
      DOTNET_VERSION: 8.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx
        continue-on-error: true

  # ============================================================
  # ✅ JOB 2 — SONARQUBE ANALYSIS + DEPLOY (ONLY ON PUSH TO STAGING)
  # ============================================================
  sonar-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    env:
      PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
      TEST_PROJECT_PATH: Agrovesto.Backend.Tests/Agrovesto.Backend.Tests.csproj
      SONAR_PROJECT_KEY: Agrovesto.Backend.API
      PUBLISH_DIR: ${{ github.workspace }}/publish
      COMMIT_SHA: ${{ github.sha }}
      DOTNET_VERSION: 8.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ✅ OPTIMIZED CACHING
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-scanner-${{ runner.os }}
          restore-keys: |
            sonar-scanner-${{ runner.os }}

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: dotnet-tools-${{ runner.os }}-${{ hashFiles('**/.config/dotnet-tools.json') }}
          restore-keys: |
            dotnet-tools-${{ runner.os }}-

      # ✅ INSTALL SONARSCANNER
      - name: Install SonarScanner and Coverage tools
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 7.1.0 || true
          dotnet tool install --global dotnet-coverage --version 17.12.4 || true
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # ✅ GET VERSION
      - name: Get project version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' ${{ env.PROJECT_PATH }} | head -1 || echo "1.0.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Project version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      # ✅ START SONARQUBE ANALYSIS
      - name: Begin SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN_DOTNET }}" \
            /v:"${{ env.VERSION }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/obj/**,**/bin/**,**/*.css,**/*.js" \
            /d:sonar.coverage.exclusions="**/*Tests/**,**/*.Tests/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.test.inclusions="**/*Tests/**,**/*.Tests/**"

      # ✅ BUILD
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # ✅ TEST WITH COVERAGE
      - name: Test & Coverage
        run: |
          dotnet-coverage collect "dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration Release \
            --verbosity normal"   
            --output coverage.xml \
            --output-format xml            
          echo "✅ Tests completed with coverage"
        continue-on-error: true
        # Convert coverage to OpenCover format for SonarQube

      ###### ✅ END SONARQUBE ANALYSIS
      - name: End SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN_DOTNET }}"

      # 🔧 ALTERNATIVE: Manual Quality Gate Check using SonarQube API
      - name: Check SonarQube Quality Gate (Manual)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          echo "Waiting for SonarQube analysis to complete..."
          sleep 10
          
          # Get the analysis ID from the report task file
          if [ -f ".sonarqube/out/.sonar/report-task.txt" ]; then
            ANALYSIS_ID=$(grep -oP 'ceTaskId=\K.*' .sonarqube/out/.sonar/report-task.txt)
            echo "Analysis ID: $ANALYSIS_ID"
            
            # Poll for task completion
            MAX_ATTEMPTS=60
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              STATUS=$(curl -s -u "${SONAR_TOKEN}:" \
                "${SONAR_HOST_URL}/api/ce/task?id=${ANALYSIS_ID}" | \
                jq -r '.task.status')
              
              echo "Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS - Status: $STATUS"
              
              if [ "$STATUS" = "SUCCESS" ]; then
                echo "✅ Analysis completed successfully"
                break
              elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "❌ Analysis failed with status: $STATUS"
                exit 1
              fi
              
              sleep 5
              ATTEMPT=$((ATTEMPT+1))
            done
            
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "❌ Timeout waiting for analysis to complete"
              exit 1
            fi
            
            # Check Quality Gate status
            QG_STATUS=$(curl -s -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}" | \
              jq -r '.projectStatus.status')
            
            echo "Quality Gate Status: $QG_STATUS"
            
            if [ "$QG_STATUS" != "OK" ]; then
              echo "❌ Quality Gate failed with status: $QG_STATUS"
              exit 1
            fi
            
            echo "✅ Quality Gate passed!"
          else
            echo "❌ Report task file not found"
            exit 1
          fi

      # ============================================================
      # 🚀 DEPLOYMENT STEPS (ONLY AFTER SONARQUBE PASSES)
      # ============================================================

      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --runtime linux-x64 \
            --framework net8.0 \
            --self-contained true \
            --output ${{ env.PUBLISH_DIR }} \
            /p:PublishTrimmed=false \
            /p:PublishSingleFile=false

      - name: Create deployment metadata
        run: |
          echo "${{ env.COMMIT_SHA }}" > ${{ env.PUBLISH_DIR }}/.commit-sha
          echo "${{ env.VERSION }}" > ${{ env.PUBLISH_DIR }}/.version
          echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > ${{ env.PUBLISH_DIR }}/.deployed-at
          echo "✅ Deployment metadata created:"
          echo "   SHA: $(cat ${{ env.PUBLISH_DIR }}/.commit-sha)"
          echo "   Version: $(cat ${{ env.PUBLISH_DIR }}/.version)"
          echo "   Deployed: $(cat ${{ env.PUBLISH_DIR }}/.deployed-at)"

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_DEV }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Create release directory
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"

      - name: Rsync files
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='*.pdb' \
            ${{ env.PUBLISH_DIR }}/ \
            ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/

      - name: Verify artifact on server
        run: |
          echo "🔍 Verifying deployment artifact..."
          REMOTE_SHA=$(ssh ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "cat /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/.commit-sha 2>/dev/null || echo 'NOT_FOUND'")
          
          if [ "$REMOTE_SHA" = "${{ env.COMMIT_SHA }}" ]; then
            echo "✅ SHA verified on server: $REMOTE_SHA"
          else
            echo "❌ SHA mismatch! Expected: ${{ env.COMMIT_SHA }}, Got: $REMOTE_SHA"
            exit 1
          fi
      - name: Swap deployment slot
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "bash /var/www/Nomaos/deploy-staging.sh ${{ env.COMMIT_SHA }}"

      - name: Health check
        run: |
          sleep 10
          echo "✅ Deployment completed successfully"
          # Uncomment when ready:
          curl -f https://dev-noma-api.nomaos.com/health || exit 1
        continue-on-error: true

      - name: Deployment Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Version: ${{ env.VERSION }}"
          echo "🔖 Commit: ${{ env.COMMIT_SHA }}"
          echo "🕐 Deployed: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "🌍 Environment: Staging"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Cleanup old releases
        if: success()
        run: |
          echo "🧹 Note: Old releases cleanup is handled by deploy-staging.sh"
