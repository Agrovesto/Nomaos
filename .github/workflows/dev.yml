name: CI - PR Quality + Deploy

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: Agrovesto.Backend.sln
  PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
  SONAR_PROJECT_KEY: Agrovesto.Backend.API
  PUBLISH_DIR: ${{ github.workspace }}/publish
  COMMIT_SHA: ${{ github.sha }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_DETERMINISTIC: true

  TEST_FLAGS: >-
    --configuration Release
    --no-build
    --verbosity minimal
    --settings coverlet.runsettings
    --results-directory ./TestResults
    -p:MaxCpuCount=2

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # ✅ JOB 1 — PR QUALITY GATE
  # ============================================================
  pr-quality-check:
    name: 🔍 PR Quality Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12  
    outputs:
      test-outcome: ${{ steps.test.outcome }}
      build-outcome: ${{ steps.build.outcome }}
      coverage-pct: ${{ steps.coverage-summary.outputs.line_coverage }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.423",
              "rollForward": "latestPatch"
            }
          }
          EOF

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔍 Verify SDK version
        run: |
          SDK=$(dotnet --version)
          echo "Active SDK: $SDK"
          [[ "$SDK" == 10.* ]] && echo "❌ SDK 10 active — pin failed" && exit 1 || true

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        id: nuget-cache
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-

      - name: 💾 Cache build outputs
        uses: actions/cache@v4
        id: build-cache
        with:
          path: |
            **/bin/Release/net8.0
            **/obj/Release
          key: build-${{ runner.os }}-${{ hashFiles('**/*.cs', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: 📦 Restore dependencies
        if: steps.nuget-cache.outputs.cache-hit != 'true' || steps.build-cache.outputs.cache-hit != 'true'
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true

      - name: 🏗️ Build
        id: build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          START=$(date +%s)

          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            -maxcpucount \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)

          # ── always write the build summary even on failure ──
          {
            echo "### 🏗️ Build"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Status | $([ $EXIT_CODE -eq 0 ] && echo '✅ Success' || echo '❌ Failed') |"
            echo "| Duration | $((END - START))s |"
            echo "| Warnings | ⚠️ $(grep -c ': warning ' build.log || true) |"
            echo "| Errors   | ❌ $(grep -c ': error '   build.log || true) |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: 🧪 Run tests (fast pass/fail)
        id: test-fast
        run: |
          dotnet test "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --logger "console;verbosity=minimal" \
            -p:MaxCpuCount=2 \
            2>&1 | tee test-fast.log

      - name: 📊 Run tests with coverage
        id: test
        run: |
          START=$(date +%s)

          dotnet test "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            -p:MaxCpuCount=2 \
            2>&1 | tee test.log

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          ELAPSED=$((END - START))

          # ── Parse counts ──
          set +o pipefail
          PASSED=$(grep  -oP 'Passed:\s*\K[0-9]+'  test.log | tail -1); PASSED="${PASSED:-0}"
          FAILED=$(grep  -oP 'Failed:\s*\K[0-9]+'  test.log | tail -1); FAILED="${FAILED:-0}"
          SKIPPED=$(grep -oP 'Skipped:\s*\K[0-9]+' test.log | tail -1); SKIPPED="${SKIPPED:-0}"
          TOTAL=$(grep   -oP 'Total:\s*\K[0-9]+'   test.log | tail -1); TOTAL="${TOTAL:-0}"
          set -o pipefail

          {
            echo "### 🧪 Test Results"
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed   | $PASSED   |"
            echo "| ❌ Failed   | $FAILED   |"
            echo "| ⏭️ Skipped  | $SKIPPED  |"
            echo "| 📊 Total    | $TOTAL    |"
            echo "| ⏱️ Duration | ${ELAPSED}s |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: 📊 Parse coverage summary
        id: coverage-summary
        if: always()
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.opencover.xml" | head -1 2>/dev/null || true)

          if [ -z "$COVERAGE_FILE" ]; then
            echo "⚠️ No coverage file found"
            printf 'line_coverage=N/A\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +o pipefail
          LINE_RATE=$(grep   -oP 'sequenceCoverage="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          BRANCH_RATE=$(grep -oP 'branchCoverage="\K[0-9.]+'   "$COVERAGE_FILE" | head -1)
          set -o pipefail

          LINE_RATE="${LINE_RATE:-0}"
          BRANCH_RATE="${BRANCH_RATE:-0}"

          [[ "$LINE_RATE"   =~ ^[0-9]+(\.[0-9]+)?$ ]] || LINE_RATE="0"
          [[ "$BRANCH_RATE" =~ ^[0-9]+(\.[0-9]+)?$ ]] || BRANCH_RATE="0"

          printf 'line_coverage=%s\n' "$LINE_RATE" >> "$GITHUB_OUTPUT"

          {
            echo "### 📊 Code Coverage"
            echo "| Type | Coverage |"
            echo "|------|----------|"
            printf "| 📝 Line/Sequence | %s%% |\n" "$LINE_RATE"
            printf "| 🌿 Branch        | %s%% |\n" "$BRANCH_RATE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/TestResults/**/*.trx'
          reporter: dotnet-trx
          fail-on-empty: true
          fail-on-error: true

      - name: 📤 Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-reports
          path: |
            TestResults/**/coverage.opencover.xml
            TestResults/**/*.trx
            build.log
            test.log
            test-fast.log
          retention-days: 7
          if-no-files-found: warn

      - name: ✅ PR Quality Gate Summary
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build.outcome }}"
          TEST_STATUS="${{ steps.test.outcome }}"
          COVERAGE="${{ steps.coverage-summary.outputs.line_coverage }}"

          STATUS_ICON() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          {
            echo "## 🎯 PR Quality Gate Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| 🏗️ Build    | $(STATUS_ICON "$BUILD_STATUS") ${BUILD_STATUS^} |"
            echo "| 🧪 Tests    | $(STATUS_ICON "$TEST_STATUS") ${TEST_STATUS^} |"
            echo "| 📊 Coverage | ${COVERAGE}% |"
            echo ""
            echo "> PR #${{ github.event.pull_request.number }} · \`${{ env.COMMIT_SHA }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # ✅ JOB 2A — SONARQUBE ANALYSIS
  # ============================================================
  sonar-analysis:
    name: 🔍 SonarQube Analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      quality-gate: ${{ steps.quality-gate.outputs.status }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.423",
              "rollForward": "latestPatch"
            }
          }
          EOF

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 💾 Cache Sonar scanner + tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar/cache
            ~/.dotnet/tools
          key: sonar-${{ runner.os }}-7.1.0
          restore-keys: sonar-${{ runner.os }}-

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-

      - name: 🔧 Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 7.1.0 2>/dev/null || true
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 📦 Restore
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "${{ env.PROJECT_PATH }}" 2>/dev/null || true)
          VERSION="${VERSION:-1.0.${{ github.run_number }}}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "**Version:** \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔍 SonarQube — Begin
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /v:"${{ steps.version.outputs.value }}" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/obj/**,**/bin/**,**/*.css,**/*.js" \
            /d:sonar.coverage.exclusions="**/*Tests/**,**/*.Tests/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.test.inclusions="**/*Tests/**,**/*.Tests/**"

      - name: 🏗️ Build (instrumented for Sonar)
        run: |
          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            -maxcpucount

      - name: 🧪 Test with coverage
        run: |
          dotnet test "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            -p:MaxCpuCount=2

      - name: 🔍 SonarQube — End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: 🎯 Quality Gate check
        id: quality-gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          REPORT=".sonarqube/out/.sonar/report-task.txt"
          [ ! -f "$REPORT" ] && echo "❌ report-task.txt missing" && exit 1

          ANALYSIS_ID=$(grep -oP 'ceTaskId=\K.*' "$REPORT")
          echo "📋 Task ID: $ANALYSIS_ID"

          # ✅ Poll with exponential-ish backoff: 5s, 5s, 10s, 10s, 15s...
          for i in $(seq 1 30); do
            RESP=$(curl -sf --max-time 10 -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/ce/task?id=${ANALYSIS_ID}")
            STATUS=$(echo "$RESP" | jq -r '.task.status')
            echo "   [$i/30] $STATUS"

            case "$STATUS" in
              SUCCESS)          break ;;
              FAILED|CANCELED)  echo "❌ Sonar task $STATUS"; exit 1 ;;
              *)                sleep $(( i < 4 ? 5 : i < 8 ? 10 : 15 )) ;;
            esac
          done

          QG=$(curl -sf --max-time 10 -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")
          QG_STATUS=$(echo "$QG" | jq -r '.projectStatus.status')

          echo "status=$QG_STATUS" >> "$GITHUB_OUTPUT"

          {
            echo "### 🎯 Quality Gate: $QG_STATUS"
            echo ""
            echo "| Metric | Actual | Threshold | Status |"
            echo "|--------|--------|-----------|--------|"
            echo "$QG" | jq -r '
              .projectStatus.conditions[] |
              "| \(.metricKey) | \(.actualValue // "N/A") | \(.errorThreshold // "N/A") | \(if .status == "OK" then "✅" else "❌" end) |"
            '
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$QG_STATUS" != "OK" ] && echo "❌ Quality Gate FAILED" && exit 1
          echo "✅ Quality Gate passed!"

  # ============================================================
  # ✅ JOB 2B — BUILD PUBLISH ARTIFACT (runs parallel to sonar)
  # ============================================================
  build-artifact:
    name: 🏗️ Build Publish Artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ✅ Tighter timeout — publish should be fast

    outputs:
      artifact-name: ${{ steps.artifact-meta.outputs.name }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.423",
              "rollForward": "latestPatch"
            }
          }
          EOF

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json' ) }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "${{ env.PROJECT_PATH }}" 2>/dev/null || true)
          VERSION="${VERSION:-1.0.${{ github.run_number }}}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish
        id: publish
        run: |
          START=$(date +%s)

          dotnet publish "${{ env.PROJECT_PATH }}" \
            --configuration Release \
            --runtime linux-x64 \
            --framework net8.0 \
            --self-contained true \
            --output "${{ env.PUBLISH_DIR }}" \
            --verbosity quiet \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -maxcpucount

          END=$(date +%s)
          SIZE=$(du -sh "${{ env.PUBLISH_DIR }}" | cut -f1)

          {
            echo "### 🚀 Publish"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ✅ Status | Success |"
            echo "| 📦 Size | $SIZE |"
            echo "| ⏱️ Duration | $((END - START))s |"
            echo "| 🏷️ Version | ${{ steps.version.outputs.value }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🏷️ Write deployment metadata
        run: |
          printf '%s' "${{ env.COMMIT_SHA }}"              > "${{ env.PUBLISH_DIR }}/.commit-sha"
          printf '%s' "${{ steps.version.outputs.value }}" > "${{ env.PUBLISH_DIR }}/.version"
          date -u +"%Y-%m-%dT%H:%M:%SZ"                   > "${{ env.PUBLISH_DIR }}/.deployed-at"

      - name: 🏷️ Artifact metadata
        id: artifact-meta
        run: printf 'name=app-%s\n' "${{ env.COMMIT_SHA }}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.name }}
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 1
          compression-level: 6

  # ============================================================
  # ✅ JOB 3 — DEPLOY
  # ============================================================
  deploy:
    name: 🚀 Deploy to Dev
    needs: [sonar-analysis, build-artifact]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.sonar-analysis.outputs.quality-gate == 'OK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: https://dev-noma-api.nomaos.com/health

    steps:
      - name: 📥 Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-artifact.outputs.artifact-name }}
          path: ${{ env.PUBLISH_DIR }}

      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}

      - name: 🔐 Trust EC2 host
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST_DEV }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 📁 Prepare + sync in one SSH session
        id: rsync
        run: |
          ssh -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"

          START=$(date +%s)
          rsync -az \
            --delete \
            --exclude='.git' \
            --exclude='*.pdb' \
            --exclude='*.xml' \
            --timeout=30 \
            --stats \
            "${{ env.PUBLISH_DIR }}/" \
            ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/ \
            2>&1 | tee rsync.log

          END=$(date +%s)
          TRANSFERRED=$(grep "Total transferred file size" rsync.log | awk '{print $5, $6}' || echo "N/A")

          {
            echo "### 📡 File Transfer"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ✅ Status | Success |"
            echo "| 📦 Transferred | $TRANSFERRED |"
            echo "| ⏱️ Duration | $((END - START))s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔎 Verify + swap in one SSH session
        run: |
          ssh -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o ConnectTimeout=10 \
              ubuntu@${{ secrets.EC2_HOST_DEV }} "
                REMOTE_SHA=\$(cat /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/.commit-sha 2>/dev/null || echo NOT_FOUND)
                if [ \"\$REMOTE_SHA\" != \"${{ env.COMMIT_SHA }}\" ]; then
                  echo '❌ SHA mismatch: expected ${{ env.COMMIT_SHA }}, got '\$REMOTE_SHA
                  exit 1
                fi
                echo '✅ SHA verified'
                bash /var/www/Nomaos/deploy-staging.sh ${{ env.COMMIT_SHA }}
              "
          echo "✅ Verified + slot swap complete" >> "$GITHUB_STEP_SUMMARY"

      - name: ❤️ Health check
        id: health
        run: |
          echo "⏳ Waiting 15s for service to stabilise..."
          sleep 15   # ✅ Reduced from 20s — modern systemd restarts are fast

          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 https://dev-noma-api.nomaos.com/health || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Healthy (attempt $i) — HTTP $HTTP_CODE"
              printf 'health_status=healthy\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "   [$i/10] HTTP $HTTP_CODE — retrying in 10s..."
            sleep 10
          done

          printf 'health_status=unhealthy\n' >> "$GITHUB_OUTPUT"
          echo "❌ Health check failed after 10 attempts" && exit 1
        continue-on-error: true

      - name: 📋 Deployment Summary
        if: always()
        env:
          HEALTH: ${{ steps.health.outputs.health_status }}
          VERSION: ${{ needs.build-artifact.outputs.version }}
          QG: ${{ needs.sonar-analysis.outputs.quality-gate }}
        run: |
          HEALTH_ICON=$([ "$HEALTH" = "healthy" ] && echo "✅" || echo "⚠️")
          {
            echo "## 🚀 Deployment Summary"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| 📦 Version      | \`$VERSION\` |"
            echo "| 🔖 Commit       | \`${{ env.COMMIT_SHA }}\` |"
            echo "| 🌍 Environment  | \`dev\` |"
            echo "| 🕐 Deployed At  | \`$(date -u +"%Y-%m-%dT%H:%M:%SZ")\` |"
            echo "| 🎯 Quality Gate | $QG |"
            echo "| $HEALTH_ICON Health | ${HEALTH:-unknown} |"
            echo "| 🔗 URL | https://dev-noma-api.nomaos.com/health |"
          } >> "$GITHUB_STEP_SUMMARY"