name: Build & Deploy API (Remote Build Optimized)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # SSH Setup
      # ----------------------------------------------------
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}

      - name: Add EC2 Host to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "Attempting to scan: ${{ secrets.EC2_HOST_DEV }}"
          ssh-keyscan -H ${{ secrets.EC2_HOST_DEV }} >> ~/.ssh/known_hosts || {
            echo "ssh-keyscan failed. Trying with verbose output:"
            ssh-keyscan -v -H ${{ secrets.EC2_HOST_DEV }}
          }

      - name: Configure SSH Keepalive
        run: |
          echo "ServerAliveInterval 60" >> ~/.ssh/config
          echo "ServerAliveCountMax 120" >> ~/.ssh/config
          echo "TCPKeepAlive yes" >> ~/.ssh/config

      # ----------------------------------------------------
      # Upload ONLY the source code (not binaries)
      # rsync is incremental—only changed files upload
      # ----------------------------------------------------
      - name: Upload source code to EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "sudo mkdir -p /var/www/Agrovesto.API && sudo chown -R ubuntu:ubuntu /var/www/Agrovesto.API"

          rsync -avz \
            --delete \
            --exclude='.git' \
            --exclude='bin/' \
            --exclude='obj/' \
            -e "ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=120" \
            ./ ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Agrovesto.API/

      # ----------------------------------------------------
      # Build API DIRECTLY on the EC2 server
      # Saves lots of time and avoids artifact storage completely
      # ----------------------------------------------------
      - name: Build & Publish on EC2
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=120 \
            ubuntu@${{ secrets.EC2_HOST_DEV }} "
              cd /var/www/Agrovesto.API && \
              dotnet publish Agrovesto.Backend.API/Agrovesto.Backend.API.csproj \
              -c Release \
              -o ./publish \
              --no-self-contained
            "

      # ----------------------------------------------------
      # Restart the systemd service
      # ----------------------------------------------------
      - name: Restart API Service
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=120 \
            ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "sudo systemctl restart Agrovesto.Backend.API.service"
