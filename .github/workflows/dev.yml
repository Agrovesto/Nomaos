name: CI - PR Quality + Deploy

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # ✅ JOB 1 — PR QUALITY CHECK (SONAR ONLY HERE)
  # ============================================================
  pr-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
      TEST_PROJECT_PATH: Agrovesto.Backend.Tests/Agrovesto.Backend.Tests.csproj
      SONAR_PROJECT_KEY: Agrovesto.Backend.API

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ✅ ADD CACHING HERE
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: dotnet-tools-${{ runner.os }}

      - run: dotnet tool install --global dotnet-sonarscanner

      - run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - run: dotnet restore

      - name: Sonar Begin (PR)
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN_DOTNET }}" \
            /d:sonar.pullrequest.key=${{ github.event.pull_request.number }} \
            /d:sonar.pullrequest.branch=${{ github.head_ref }} \        
            /d:sonar.pullrequest.base=staging

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release

      - run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN_DOTNET }}"
      

  # ============================================================
  # ✅ JOB 2 — DEPLOY (NO SONAR HERE)
  # ============================================================
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
      PUBLISH_DIR: ${{ github.workspace }}/publish
      COMMIT_SHA: ${{ github.sha }}
      SONAR_PROJECT_KEY: Agrovesto.Backend.API


    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -f net8.0 \
            --no-restore \
            -o ${{ env.PUBLISH_DIR }}

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}

      - name: Add EC2 host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_DEV }} >> ~/.ssh/known_hosts

      - name: Rsync
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"

          rsync -az --delete \
            ${{ env.PUBLISH_DIR }}/ \
            ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/

      - name: Swap Slot
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "bash /var/www/Nomaos/deploy-staging.sh ${{ env.COMMIT_SHA }}"