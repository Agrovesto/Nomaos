name: CI - PR Quality + Deploy

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: Agrovesto.Backend.sln
  PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
  SONAR_PROJECT_KEY: Agrovesto.Backend.API
  PUBLISH_DIR: ${{ github.workspace }}/publish
  COMMIT_SHA: ${{ github.sha }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_DETERMINISTIC: true

defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # ✅ JOB 1 — PR QUALITY GATE
  # ============================================================
  pr-quality-check:
    name: 🔍 PR Quality Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      test-outcome: ${{ steps.test.outcome }}
      build-outcome: ${{ steps.build.outcome }}
      coverage-pct: ${{ steps.coverage-summary.outputs.line_coverage }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Pin the SDK version BEFORE setup-dotnet so the runner
      #    honours it instead of defaulting to the pre-installed SDK ──
      - name: 📌 Pin .NET SDK version
        run: |
          # Resolve the exact latest 8.x patch already installed, or let
          # setup-dotnet install it. Using "latestPatch" avoids SDK 10 takeover.
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.423",
              "rollForward": "latestPatch"
            }
          }
          EOF

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # Do NOT use built-in cache here; we manage it manually below
          # so we can key on all lock files across the solution.

      - name: 🔍 Verify SDK version
        run: |
          SDK=$(dotnet --version)
          echo "Active SDK: $SDK"
          if [[ "$SDK" == 10.* ]]; then
            echo "❌ SDK 10 is active — global.json pin failed."
            exit 1
          fi

      # ── NuGet cache: key on every .csproj + .sln so a single changed
      #    project doesn't share stale packages ──
      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            ${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-

      # ── Restore MUST run (and succeed) before any --no-restore step ──
      - name: 📦 Restore dependencies
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true

      # ── Build and capture log for warning/error counts ──
      - name: 🏗️ Build
        id: build
        run: |
          START=$(date +%s)

          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          ELAPSED=$((END - START))

          WARNINGS=$(grep -c ": warning " build.log || true)
          ERRORS=$(grep -c ": error "   build.log || true)

          echo "### 🏗️ Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |"   >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|"   >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | $([ $EXIT_CODE -eq 0 ] && echo '✅ Success' || echo '❌ Failed') |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| Duration | ${ELAPSED}s |"       >> "$GITHUB_STEP_SUMMARY"
          echo "| Warnings | ⚠️ ${WARNINGS} |"    >> "$GITHUB_STEP_SUMMARY"
          echo "| Errors   | ❌ ${ERRORS} |"      >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      # ── Tests: --no-build because we already built above ──
      - name: 🧪 Run tests with coverage
        id: test
        run: |
          START=$(date +%s)

          dotnet test "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            --collect "XPlat Code Coverage;Format=opencover" \
            --results-directory ./TestResults \
            -p:ParallelizeTestCollections=true \
            -p:MaxCpuCount=-1 \
            2>&1 | tee test.log

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          ELAPSED=$((END - START))

          PASSED=$(grep -oP  'Passed:\s*\K[0-9]+'  test.log | tail -1 || echo "0")
          FAILED=$(grep -oP  'Failed:\s*\K[0-9]+'  test.log | tail -1 || echo "0")
          SKIPPED=$(grep -oP 'Skipped:\s*\K[0-9]+' test.log | tail -1 || echo "0")
          TOTAL=$(grep -oP   'Total:\s*\K[0-9]+'   test.log | tail -1 || echo "0")

          echo "### 🧪 Test Results"     >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |"      >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|"      >> "$GITHUB_STEP_SUMMARY"
          echo "| ✅ Passed   | $PASSED   |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❌ Failed   | $FAILED   |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ⏭️ Skipped  | $SKIPPED  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📊 Total    | $TOTAL    |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ⏱️ Duration | ${ELAPSED}s |" >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      # ── Coverage ──
      - name: 📊 Parse coverage summary
        id: coverage-summary
        if: always()
        run: |
          # opencover puts the file inside a GUID sub-directory
          COVERAGE_FILE=$(find ./TestResults -name "coverage.opencover.xml" | head -1)

          if [ -z "$COVERAGE_FILE" ]; then
            echo "⚠️ No coverage file found"
            echo "line_coverage=N/A" >> "$GITHUB_OUTPUT"
          else
            LINE_RATE=$(grep -oP 'sequenceCoverage="\K[0-9.]+' "$COVERAGE_FILE" | head -1 || echo "0")
            BRANCH_RATE=$(grep -oP 'branchCoverage="\K[0-9.]+'  "$COVERAGE_FILE" | head -1 || echo "0")

            echo "line_coverage=${LINE_RATE}" >> "$GITHUB_OUTPUT"

            echo "### 📊 Code Coverage"              >> "$GITHUB_STEP_SUMMARY"
            echo "| Type | Coverage |"               >> "$GITHUB_STEP_SUMMARY"
            echo "|------|----------|"               >> "$GITHUB_STEP_SUMMARY"
            echo "| 📝 Line/Sequence | ${LINE_RATE}% |"   >> "$GITHUB_STEP_SUMMARY"
            echo "| 🌿 Branch        | ${BRANCH_RATE}% |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📂 List TestResults (debug)
        if: always()
        run: |
          echo "=== TestResults directory ==="
          find ./TestResults -type f 2>/dev/null || echo "No files found in ./TestResults"

      # dorny/test-reporter needs the TRX; it runs even when tests fail
      - name: 📝 Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/TestResults/**/*.trx'   # broader glob — covers GUID sub-dirs
          reporter: dotnet-trx
          fail-on-empty: true
          fail-on-error: true

      - name: 📤 Upload coverage & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-pr-${{ github.event.pull_request.number }}
          path: |
            TestResults/**/coverage.opencover.xml
            build.log
            test.log
          retention-days: 7
          if-no-files-found: warn

      - name: ✅ PR Quality Gate Summary
        if: always()
        run: |
          BUILD_STATUS="${{ steps.build.outcome }}"
          TEST_STATUS="${{ steps.test.outcome }}"
          COVERAGE="${{ steps.coverage-summary.outputs.line_coverage }}"

          STATUS_ICON() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          echo "## 🎯 PR Quality Gate Summary"   >> "$GITHUB_STEP_SUMMARY"
          echo ""                                  >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |"               >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|"               >> "$GITHUB_STEP_SUMMARY"
          echo "| 🏗️ Build | $(STATUS_ICON $BUILD_STATUS) ${BUILD_STATUS^} |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| 🧪 Tests | $(STATUS_ICON $TEST_STATUS) ${TEST_STATUS^} |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| 📊 Coverage | ${COVERAGE}% |"  >> "$GITHUB_STEP_SUMMARY"
          echo ""                                  >> "$GITHUB_STEP_SUMMARY"
          echo "> PR #${{ github.event.pull_request.number }} · \`${{ env.COMMIT_SHA }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # ✅ JOB 2A — SONARQUBE ANALYSIS
  # ============================================================
  sonar-analysis:
    name: 🔍 SonarQube Analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      quality-gate: ${{ steps.quality-gate.outputs.status }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.423",
              "rollForward": "latestPatch"
            }
          }
          EOF

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 💾 Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar/cache
            ~/.dotnet/tools
          key: sonar-tools-${{ runner.os }}-${{ hashFiles('**/.config/dotnet-tools.json') }}
          restore-keys: sonar-tools-${{ runner.os }}-

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            ${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-

      - name: 🔧 Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 7.1.0 2>/dev/null || true
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 📦 Restore
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "${{ env.PROJECT_PATH }}" 2>/dev/null || true)
          [ -z "$VERSION" ] && VERSION="1.0.${{ github.run_number }}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "**Version:** \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔍 SonarQube — Begin
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /v:"${{ steps.version.outputs.value }}" \
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/obj/**,**/bin/**,**/*.css,**/*.js" \
            /d:sonar.coverage.exclusions="**/*Tests/**,**/*.Tests/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.test.inclusions="**/*Tests/**,**/*.Tests/**"

      - name: 🏗️ Build (instrumented)
        run: |
          dotnet build "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            -maxcpucount

      - name: 🧪 Test with coverage
        run: |
          dotnet test "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage;Format=opencover" \
            --results-directory ./TestResults \
            -p:ParallelizeTestCollections=true \
            -p:MaxCpuCount=-1

      - name: 🔍 SonarQube — End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: 🎯 Quality Gate check
        id: quality-gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
        run: |
          REPORT=".sonarqube/out/.sonar/report-task.txt"
          [ ! -f "$REPORT" ] && echo "❌ report-task.txt missing" && exit 1

          ANALYSIS_ID=$(grep -oP 'ceTaskId=\K.*' "$REPORT")
          echo "📋 Task ID: $ANALYSIS_ID"

          for i in $(seq 1 40); do
            RESP=$(curl -sf --max-time 10 -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/ce/task?id=${ANALYSIS_ID}")
            STATUS=$(echo "$RESP" | jq -r '.task.status')
            echo "   [$i/40] Task status: $STATUS"

            case "$STATUS" in
              SUCCESS)  break ;;
              FAILED|CANCELED) echo "❌ Sonar task $STATUS"; exit 1 ;;
              *) sleep 5 ;;
            esac
          done

          QG=$(curl -sf --max-time 10 -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")
          QG_STATUS=$(echo "$QG" | jq -r '.projectStatus.status')

          echo "status=$QG_STATUS" >> "$GITHUB_OUTPUT"

          echo "### 🎯 Quality Gate: $QG_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Actual | Threshold | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "$QG" | jq -r '
            .projectStatus.conditions[] |
            "| \(.metricKey) | \(.actualValue // "N/A") | \(.errorThreshold // "N/A") | \(if .status == "OK" then "✅" else "❌" end) |"
          ' >> "$GITHUB_STEP_SUMMARY"

          [ "$QG_STATUS" != "OK" ] && echo "❌ Quality Gate FAILED" && exit 1
          echo "✅ Quality Gate passed!"

  # ============================================================
  # ✅ JOB 2B — BUILD PUBLISH ARTIFACT
  # ============================================================
  build-artifact:
    name: 🏗️ Build Publish Artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      artifact-name: ${{ steps.artifact-meta.outputs.name }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << 'EOF'
          {
            "sdk": {
              "version": "8.0.423",
              "rollForward": "latestPatch"
            }
          }
          EOF

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            ${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ env.DOTNET_VERSION }}-
            nuget-${{ runner.os }}-

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "${{ env.PROJECT_PATH }}" 2>/dev/null || true)
          [ -z "$VERSION" ] && VERSION="1.0.${{ github.run_number }}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 📦 Restore
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" \
            --runtime linux-x64 \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true

      - name: 🚀 Publish
        id: publish
        run: |
          START=$(date +%s)

          dotnet publish "${{ env.PROJECT_PATH }}" \
            --configuration Release \
            --runtime linux-x64 \
            --framework net8.0 \
            --self-contained true \
            --no-restore \
            --output "${{ env.PUBLISH_DIR }}" \
            --verbosity quiet \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -maxcpucount

          END=$(date +%s)
          ELAPSED=$((END - START))
          SIZE=$(du -sh "${{ env.PUBLISH_DIR }}" | cut -f1)

          echo "### 🚀 Publish"                       >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |"                   >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|"                   >> "$GITHUB_STEP_SUMMARY"
          echo "| ✅ Status | Success |"              >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 Size | $SIZE |"                  >> "$GITHUB_STEP_SUMMARY"
          echo "| ⏱️ Duration | ${ELAPSED}s |"        >> "$GITHUB_STEP_SUMMARY"
          echo "| 🏷️ Version | ${{ steps.version.outputs.value }} |" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 🏷️ Write deployment metadata
        run: |
          echo "${{ env.COMMIT_SHA }}"            > "${{ env.PUBLISH_DIR }}/.commit-sha"
          echo "${{ steps.version.outputs.value }}" > "${{ env.PUBLISH_DIR }}/.version"
          date -u +"%Y-%m-%dT%H:%M:%SZ"          > "${{ env.PUBLISH_DIR }}/.deployed-at"

      - name: 🏷️ Artifact metadata
        id: artifact-meta
        run: |
          echo "name=app-${{ env.COMMIT_SHA }}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.name }}
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 1
          compression-level: 6

  # ============================================================
  # ✅ JOB 3 — DEPLOY
  # ============================================================
  deploy:
    name: 🚀 Deploy to Dev
    needs: [sonar-analysis, build-artifact]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.sonar-analysis.outputs.quality-gate == 'OK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: https://dev-noma-api.nomaos.com/health

    steps:
      - name: 📥 Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-artifact.outputs.artifact-name }}
          path: ${{ env.PUBLISH_DIR }}

      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}

      - name: 🔐 Trust EC2 host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST_DEV }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 📁 Prepare release directory
        run: |
          ssh -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"

      - name: 📡 Rsync files to server
        id: rsync
        run: |
          START=$(date +%s)

          rsync -az \
            --delete \
            --exclude='.git' \
            --exclude='*.pdb' \
            --exclude='*.xml' \
            --timeout=30 \
            --stats \
            "${{ env.PUBLISH_DIR }}/" \
            ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/ \
            2>&1 | tee rsync.log

          END=$(date +%s)
          ELAPSED=$((END - START))
          TRANSFERRED=$(grep "Total transferred file size" rsync.log | awk '{print $5, $6}' || echo "N/A")

          echo "### 📡 File Transfer"                       >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |"                         >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|"                         >> "$GITHUB_STEP_SUMMARY"
          echo "| ✅ Status | Success |"                    >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 Transferred | $TRANSFERRED |"          >> "$GITHUB_STEP_SUMMARY"
          echo "| ⏱️ Duration | ${ELAPSED}s |"              >> "$GITHUB_STEP_SUMMARY"

      - name: 🔎 Verify artifact on server
        run: |
          REMOTE_SHA=$(ssh -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "cat /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/.commit-sha 2>/dev/null || echo 'NOT_FOUND'")

          if [ "$REMOTE_SHA" = "${{ env.COMMIT_SHA }}" ]; then
            echo "✅ SHA verified: $REMOTE_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ SHA mismatch! Expected: ${{ env.COMMIT_SHA }}, Got: $REMOTE_SHA"
            exit 1
          fi

      - name: 🔄 Swap deployment slot
        run: |
          ssh -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o ConnectTimeout=10 \
              ubuntu@${{ secrets.EC2_HOST_DEV }} \
              "bash /var/www/Nomaos/deploy-staging.sh ${{ env.COMMIT_SHA }}"

      - name: ❤️ Health check
        id: health
        run: |
          echo "⏳ Waiting 20s for service to stabilise..."
          sleep 20

          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 https://dev-noma-api.nomaos.com/health || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (attempt $i) — HTTP $HTTP_CODE"
              echo "health_status=healthy" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "   [$i/10] HTTP $HTTP_CODE — retrying in 10s..."
            sleep 10
          done

          echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
          echo "❌ Health check failed after 10 attempts" && exit 1
        continue-on-error: true

      - name: 📋 Deployment Summary
        if: always()
        env:
          HEALTH: ${{ steps.health.outputs.health_status }}
          VERSION: ${{ needs.build-artifact.outputs.version }}
          QG: ${{ needs.sonar-analysis.outputs.quality-gate }}
        run: |
          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HEALTH_ICON=$([ "$HEALTH" = "healthy" ] && echo "✅" || echo "⚠️")

          echo "## 🚀 Deployment Summary"                       >> "$GITHUB_STEP_SUMMARY"
          echo ""                                                 >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |"                                 >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|"                                 >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 Version     | \`$VERSION\` |"              >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔖 Commit      | \`${{ env.COMMIT_SHA }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🌍 Environment | \`dev\` |"                   >> "$GITHUB_STEP_SUMMARY"
          echo "| 🕐 Deployed At | \`$DEPLOYED_AT\` |"          >> "$GITHUB_STEP_SUMMARY"
          echo "| 🎯 Quality Gate | $QG |"                      >> "$GITHUB_STEP_SUMMARY"
          echo "| $HEALTH_ICON Health | ${HEALTH:-unknown} |"   >> "$GITHUB_STEP_SUMMARY"
