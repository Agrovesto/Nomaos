name: CI/CD Deploy Agrovesto.Backend.API

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP: Agrovesto.Backend.API
      PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
      PUBLISH_DIR: ${{ github.workspace }}/publish
      COMMIT_SHA: ${{ github.sha }}
      DOTNET_VERSION: 8.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Build artifact in CI (never on the server) ──────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure .NET SDK
        run: |
          # Pin an explicit SDK version that actually exists on the runner
          INSTALLED_SDK=$(dotnet --list-sdks | grep '^8\.' | tail -1 | awk '{print $1}')
          echo "Using SDK version: $INSTALLED_SDK"
          
          cat > global.json << EOF
          {
            "sdk": {
              "version": "$INSTALLED_SDK",
              "rollForward": "disable"
            }
          }
          EOF
          
          cat global.json
          dotnet --version

      - name: Debug SDK version
        run: |
          echo "===== global.json ====="
          cat global.json
          echo ""
          echo "===== dotnet --version ====="
          dotnet --version
          echo ""
          echo "===== dotnet --list-sdks ====="
          dotnet --list-sdks
          echo ""
          echo "===== which dotnet ====="
          which dotnet
          echo ""
          echo "===== DOTNET_ROOT ====="
          echo "$DOTNET_ROOT"

      # ── Clean stale obj/ and bin/ before every build ─────────────────────────
      - name: Clean
        run: |
          dotnet clean ${{ env.PROJECT_PATH }} --configuration Release || true
          rm -rf ${{ env.PROJECT_PATH }}/../obj
          rm -rf ${{ env.PROJECT_PATH }}/../bin          

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}-${{ github.run_id }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: dotnet-tools-${{ runner.os }}-${{ hashFiles('**/.config/dotnet-tools.json') }}
          restore-keys: dotnet-tools-${{ runner.os }}-

      - name: Get project version
        shell: bash
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "${{ env.PROJECT_PATH }}" || true)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Project version: $VERSION"

      - name: Restore Dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} \
            --runtime linux-x64 

      - name: Build
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-restore


      - name: Publish Artifact
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --runtime linux-x64 \
            --framework net8.0 \
            --self-contained true \
            --no-restore \
            --output ${{ env.PUBLISH_DIR }}

          # Stamp the artifact with full deployment metadata
          cat > ${{ env.PUBLISH_DIR }}/.deploy-meta <<EOF
          commit=${{ env.COMMIT_SHA }}
          pr_number=${{ steps.pr_meta.outputs.pr_number }}
          pr_author=${{ steps.pr_meta.outputs.pr_author }}
          pr_approver=${{ steps.pr_meta.outputs.pr_approver }}
          deployed_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          deployed_by=${{ github.actor }}
          branch=${{ github.ref_name }}
          EOF

          # Stamp the build with the commit SHA for traceability
          echo "${{ env.COMMIT_SHA }}" > ${{ env.PUBLISH_DIR }}/.commit-sha

      - name: Create deployment metadata
        run: |
          echo "${{ env.COMMIT_SHA }}" > ${{ env.PUBLISH_DIR }}/.commit-sha
          echo "${{ env.VERSION }}" > ${{ env.PUBLISH_DIR }}/.version
          echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > ${{ env.PUBLISH_DIR }}/.deployed-at
          echo "✅ Deployment metadata created"

      # ── Ship artifact to EC2 via rsync ───────────────────────────────────────
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_PROD }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_PROD }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Create release directory on server
        run: |
          ssh -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST_PROD }} \
            "sudo mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"

      - name: Rsync artifact to EC2 (incoming staging area)
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='*.pdb' \
            --exclude='*.xml' \
            --timeout=30 \
            ${{ env.PUBLISH_DIR }}/ \
            ubuntu@${{ secrets.EC2_HOST_PROD }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/

      - name: Verify artifact on server
        run: |
          REMOTE_SHA=$(ssh -o ConnectTimeout=10 ubuntu@${{ secrets.EC2_HOST_PROD }} \
            "cat /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/.commit-sha 2>/PROD/null || echo 'NOT_FOUND'")
          if [ "$REMOTE_SHA" = "${{ env.COMMIT_SHA }}" ]; then
            echo "✅ SHA verified on server: $REMOTE_SHA"
          else
            echo "❌ SHA mismatch! Expected: ${{ env.COMMIT_SHA }}, Got: $REMOTE_SHA"
            exit 1
          fi

      # ── Atomic slot-swap on EC2 (no compiling, just symlink + systemctl) ─────
      - name: Swap  deploymentslot
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ubuntu@${{ secrets.EC2_HOST_PROD }} \
              "bash /var/www/Nomaos/deploy-prod.sh ${{ env.COMMIT_SHA }}"

      - name: Health check
        run: |
          echo "⏳ Waiting for health check..."
          sleep 20
          for i in {1..10}; do
            if curl -sf --max-time 5 https://noma-api.nomaos.com/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "   Retry $i/10..."
            sleep 10
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1
        continue-on-error: true

      # ── Deployment summary ────────────────────────────────────────────────────
      - name: Write deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| PR | #${{ steps.pr_meta.outputs.pr_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Raised by | \`${{ steps.pr_meta.outputs.pr_author }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Approved by | \`${{ steps.pr_meta.outputs.pr_approver }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Merged by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ env.COMMIT_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY