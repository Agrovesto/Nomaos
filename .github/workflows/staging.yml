name: Build and Deploy (staging branch)

on:
  push:
    branches: [staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# GITHUB TOKEN PERMISSIONS
# ============================================================
permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  DOTNET_SDK_VERSION: 8.0.423
  SOLUTION_PATH: Agrovesto.Backend.sln
  PROJECT_PATH: Agrovesto.Backend.API/Agrovesto.Backend.API.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish
  COMMIT_SHA: ${{ github.sha }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_DETERMINISTIC: true

defaults:
  run:
    shell: bash

jobs:
  build-deploy-staging:
    name: 🚀 Build + Test + Deploy (staging branch)

    runs-on: ubuntu-latest

    timeout-minutes: 30

    environment:
      name: dev
      url: https://dev-noma-api.nomaos.com/health/ready

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # PIN SDK
      # =========================================================

      - name: 📌 Pin .NET SDK version
        run: |
          cat > global.json << EOF
          {
            "sdk": {
              "version": "${{ env.DOTNET_SDK_VERSION }}",
              "rollForward": "latestPatch"
            }
          }
          EOF

          echo "===== global.json ====="
          cat global.json


      # =========================================================
      # SETUP .NET
      # =========================================================

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}


      # =========================================================
      # VERIFY SDK
      # =========================================================

      - name: 🔍 Verify SDK
        run: |
          SDK=$(dotnet --version)

          echo "Active SDK: $SDK"

          if [[ "$SDK" != 8.* ]]; then
            echo "❌ Expected .NET 8 SDK"
            exit 1
          fi


      # =========================================================
      # CACHE NUGET
      #
      # This is the most important performance optimization.
      #
      # We persist the dependency cache, NOT the application.
      # ==============================================================

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages

          key: >
            nuget-${{ runner.os }}-
            dotnet-${{ env.DOTNET_SDK_VERSION }}-
            ${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}

          restore-keys: |
            nuget-${{ runner.os }}-dotnet-${{ env.DOTNET_SDK_VERSION }}-
            nuget-${{ runner.os }}-


      # =========================================================
      # RESTORE
      # =========================================================

      - name: 📦 Restore dependencies
        run: |
          dotnet restore \
            "${{ env.SOLUTION_PATH }}" \
            --verbosity quiet \
            /p:ContinuousIntegrationBuild=true


      # =========================================================
      # VERSION
      # =========================================================

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(
            grep \
              -oPm1 '(?<=<Version>)[^<]+' \
              "${{ env.PROJECT_PATH }}" \
              2>/dev/null ||
              true
          )

          VERSION="${VERSION:-1.0.${{ github.run_number }}}"

          echo "value=$VERSION" \
            >> "$GITHUB_OUTPUT"

          echo "📦 Version: $VERSION"


      # =========================================================
      # BUILD
      # =========================================================

      - name: 🏗️ Build
        id: build
        run: |
          START=$(date +%s)

          dotnet build \
            "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-restore \
            --verbosity quiet \
            -maxcpucount \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          END=$(date +%s)

          {
            echo "### 🏗️ Build"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Status | $([ "$EXIT_CODE" -eq 0 ] && echo '✅ Success' || echo '❌ Failed') |"
            echo "| Duration | $((END - START))s |"
            echo "| Warnings | ⚠️ $(grep -c ': warning ' build.log || true) |"
            echo "| Errors | ❌ $(grep -c ': error ' build.log || true) |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$EXIT_CODE"


      # =========================================================
      # TEST
      # =========================================================

      - name: 🧪 Test with coverage
        id: test
        run: |
          START=$(date +%s)

          dotnet test \
            "${{ env.SOLUTION_PATH }}" \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults \
            -p:MaxCpuCount=2

          EXIT_CODE=$?

          END=$(date +%s)

          echo "Tests completed in $((END - START))s"

          exit "$EXIT_CODE"


      # =========================================================
      # PUBLISH APPLICATION
      #
      # THIS STAYS ON THE SAME RUNNER.
      #
      # Nothing goes to GitHub artifact storage.
      # =========================================================

      - name: 🚀 Publish application
        id: publish
        run: |

          START=$(date +%s)

          rm -rf "${{ env.PUBLISH_DIR }}"

          dotnet publish \
            "${{ env.PROJECT_PATH }}" \
            --configuration Release \
            --runtime linux-x64 \
            --framework net8.0 \
            --self-contained true \
            --output "${{ env.PUBLISH_DIR }}" \
            --verbosity quiet \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -maxcpucount


          END=$(date +%s)

          SIZE=$(
            du -sh "${{ env.PUBLISH_DIR }}" |
            cut -f1
          )


          {
            echo "### 🚀 Publish"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ✅ Status | Success |"
            echo "| 📦 Size | $SIZE |"
            echo "| 📁 Files | $(find "${{ env.PUBLISH_DIR }}" -type f | wc -l | tr -d ' ') |"
            echo "| ⏱️ Duration | $((END - START))s |"
            echo "| 🏷️ Version | ${{ steps.version.outputs.value }} |"
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # WRITE DEPLOYMENT METADATA
      # =========================================================

      - name: 🏷️ Write deployment metadata
        run: |

          echo "${{ env.COMMIT_SHA }}" \
            > "${{ env.PUBLISH_DIR }}/.commit-sha"

          echo "${{ steps.version.outputs.value }}" \
            > "${{ env.PUBLISH_DIR }}/.version"

          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > "${{ env.PUBLISH_DIR }}/.deployed-at"


          echo "===== Metadata ====="

          ls -la \
            "${{ env.PUBLISH_DIR }}/.commit-sha" \
            "${{ env.PUBLISH_DIR }}/.version" \
            "${{ env.PUBLISH_DIR }}/.deployed-at"

          echo ""
          echo "===== SHA ====="

          cat "${{ env.PUBLISH_DIR }}/.commit-sha"


      # =========================================================
      # SSH AGENT
      # =========================================================

      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_DEV }}


      # =========================================================
      # TRUST EC2
      # =========================================================

      - name: 🔐 Trust EC2 host
        run: |

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          ssh-keyscan -H \
            "${{ secrets.EC2_HOST_DEV }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # =========================================================
      # CREATE RELEASE DIRECTORY
      # =========================================================

      - name: 📁 Prepare release directory
        run: |

          ssh \
            -o ConnectTimeout=10 \
            ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "mkdir -p /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}"


      # =========================================================
      # RSYNC DIRECTLY TO DEV EC2
      #
      # The publish directory is copied directly from the current
      # runner to EC2.
      #
      # NO GitHub artifact.
      # =========================================================

      - name: 📡 Sync application to Dev EC2
        id: rsync
        run: |

          START=$(date +%s)


          rsync \
            -az \
            --delete \
            --exclude='.git' \
            --exclude='*.pdb' \
            --exclude='*.xml' \
            --timeout=30 \
            --stats \
            "${{ env.PUBLISH_DIR }}/" \
            "ubuntu@${{ secrets.EC2_HOST_DEV }}:/var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/" \
            2>&1 | tee rsync.log


          EXIT_CODE=${PIPESTATUS[0]}


          END=$(date +%s)


          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Rsync failed"
            exit "$EXIT_CODE"
          fi


          TRANSFERRED=$(
            grep \
              "Total transferred file size" \
              rsync.log |
            awk '{print $5, $6}' ||
            echo "N/A"
          )


          {
            echo "### 📡 File Transfer"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ✅ Status | Success |"
            echo "| 📦 Transferred | $TRANSFERRED |"
            echo "| ⏱️ Duration | $((END - START))s |"
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # VERIFY REMOTE SHA
      # =========================================================

      - name: 🔎 Verify application on server
        run: |

          REMOTE_SHA=$(
            ssh \
              -o ConnectTimeout=10 \
              ubuntu@${{ secrets.EC2_HOST_DEV }} \
              "cat /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/.commit-sha 2>/dev/null | tr -d '[:space:]' || echo NOT_FOUND"
          )


          echo "Expected SHA: ${{ env.COMMIT_SHA }}"
          echo "Remote SHA:   $REMOTE_SHA"


          if [ "$REMOTE_SHA" != "${{ env.COMMIT_SHA }}" ]; then

            echo "❌ Remote SHA mismatch"

            echo "===== Remote directory ====="

            ssh \
              ubuntu@${{ secrets.EC2_HOST_DEV }} \
              "ls -la /var/www/Nomaos/releases/${{ env.COMMIT_SHA }}/"

            exit 1
          fi


          echo "✅ Remote SHA verified: $REMOTE_SHA"


      # =========================================================
      # DEPLOY
      # =========================================================

      - name: 🔄 Swap deployment slot
        run: |

          ssh \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o ConnectTimeout=10 \
            ubuntu@${{ secrets.EC2_HOST_DEV }} \
            "bash /var/www/Nomaos/deploy-staging.sh ${{ env.COMMIT_SHA }}"


          echo "✅ Slot swap complete"


      # =========================================================
      # HEALTH CHECK
      # =========================================================

      - name: ❤️ Health check
        id: health
        run: |

          echo "⏳ Waiting 15 seconds for service to stabilise..."

          sleep 15


          for i in $(seq 1 10); do

            HTTP_CODE=$(
              curl \
                -s \
                -o /dev/null \
                -w "%{http_code}" \
                --max-time 5 \
                https://dev-noma-api.nomaos.com/health/ready ||
              echo "000"
            )


            if [ "$HTTP_CODE" = "200" ]; then

              echo "✅ Healthy (attempt $i) — HTTP $HTTP_CODE"

              printf 'health_status=healthy\n' \
                >> "$GITHUB_OUTPUT"

              exit 0

            fi


            echo "[$i/10] HTTP $HTTP_CODE — retrying in 10s..."

            sleep 10

          done


          printf 'health_status=unhealthy\n' \
            >> "$GITHUB_OUTPUT"


          echo "❌ Health check failed after 10 attempts"

          exit 1
        continue-on-error: true


      # =========================================================
      # DEPLOYMENT SUMMARY
      # =========================================================

      - name: 📋 Deployment Summary
        if: always()
        env:
          HEALTH: ${{ steps.health.outputs.health_status }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |

          HEALTH_ICON=$(
            [ "$HEALTH" = "healthy" ] &&
              echo "✅" ||
              echo "❌"
          )


          {
            echo "## 🚀 Deployment Summary"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| 📦 Version | \`$VERSION\` |"
            echo "| 🔖 Commit | \`${{ env.COMMIT_SHA }}\` |"
            echo "| 🌍 Environment | \`dev\` |"
            echo "| $HEALTH_ICON Health | ${HEALTH:-unknown} |"
            echo "| 🕐 Deployed At | \`$(date -u +"%Y-%m-%dT%H:%M:%SZ")\` |"
            echo "| 🔗 URL | https://dev-noma-api.nomaos.com/health |"
          } >> "$GITHUB_STEP_SUMMARY"


      # =========================================================
      # CLEAN LOCAL FILES
      # =========================================================

      - name: 🧹 Clean runner
        if: always()
        run: |

          rm -rf "${{ env.PUBLISH_DIR }}"
          rm -rf ./TestResults

          echo "✅ Local build files cleaned"
