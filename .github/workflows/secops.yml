# # ─────────────────────────────────────────────────────────────────────────────
# # Minimal permissions — elevated only where required
# # ─────────────────────────────────────────────────────────────────────────────
# permissions:
#   contents:        read
#   security-events: write   # SARIF upload → GitHub Security tab
#   pull-requests:   write   # PR comments
#   actions:         read    # Artifact download between jobs
#   checks:          write   # Check run status updates
#   statuses:        write   # Commit status updates

