name: Prod - Validate, Promote & Deploy to ECS

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Source ECR tag in dev/staging account (e.g. short SHA or staging-latest)."
        required: false
        default: "staging-latest"

concurrency:
  group: "prod-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # ----- Source (dev/staging account) -----
  SRC_AWS_REGION: eu-west-1
  SRC_ECR_REPOSITORY: agrovesto-dev-nomaos
  # ----- Destination (prod account) -----
  PROD_AWS_REGION: eu-west-1
  PROD_ECR_REPOSITORY: agrovesto-prod-nomaos
  PROD_ECS_CLUSTER: nomaos-prod-cluster
  PROD_ECS_SERVICE: nomaos-api-prod
  PROD_ECS_CONTAINER: nomaos-api
  PROD_ECS_TASK_FAMILY: nomaos-api-prod
  # ----- Shared -----
  APP_NAME: nomaos-api
  SOLUTION_PATH: Agrovesto.Backend.sln
  TEST_PROJECT: NomaOS.Test/NomaOS.Test.csproj

defaults:
  run:
    shell: bash

jobs:

  # =========================================================================
  # PR: Secret & FS scans
  # =========================================================================
  secret-and-fs-scan:
    name: 🔒 Secret & FS Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          extra_args: --only-verified --fail

      - name: Trivy repo scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  # =========================================================================
  # PR: Checkov
  # =========================================================================
  iac-scan:
    name: 🧱 Checkov
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,github_actions,terraform,kubernetes
          soft_fail: false
          quiet: true
          output_format: cli

  # =========================================================================
  # PR: Tests + SonarQube
  # =========================================================================
  sonarqube-sast:
    name: 🧪 Tests + SonarQube
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: secops
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT: ${{ secrets.SONAR_PROJECT }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore "$TEST_PROJECT"

      - name: SonarQube begin
        run: |
          VERSION=$(dotnet msbuild Agrovesto.Backend.API/Agrovesto.Backend.API.csproj -getProperty:Version 2>/dev/null || echo "0.0.0")
          dotnet sonarscanner begin \
            /k:"${SONAR_PROJECT}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.projectVersion="${VERSION:-0.0.0}" \
            /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**,**/*.md"

      - name: Build
        run: dotnet build "$TEST_PROJECT" -c Release --no-restore

      - name: Test and coverage
        run: |
          dotnet test "$TEST_PROJECT" -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarQube end
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Quality gate
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt

  # =========================================================================
  # PR: Validate image (build + Trivy, no push)
  # =========================================================================
  validate-image:
    name: 🐳 Build & Scan Image (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.APP_NAME }}:scan
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.APP_NAME }}:scan
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  # =========================================================================
  # PUSH: Promote image from dev/staging ECR → prod ECR (cross-account)
  # Pulls by digest, re-pushes to prod account.
  # =========================================================================
  promote-image:
    name: 🔄 Promote Image to Prod ECR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      id-token: write
      contents: read
    outputs:
      prod_image: ${{ steps.push.outputs.prod_image }}
      deploy_tag: ${{ steps.push.outputs.deploy_tag }}
    steps:
      # --- Source: dev/staging account (pull) ---
      - name: Configure AWS creds (dev/staging account - SOURCE)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.SRC_AWS_REGION }}
          role-session-name: prod-promote-source

      - name: Login to source ECR (dev/staging)
        id: src-login
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

      - name: Resolve source image digest
        id: src
        env:
          SOURCE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          SOURCE_TAG="${SOURCE_TAG_INPUT:-staging-latest}"
          REGISTRY="${{ steps.src-login.outputs.registry }}"
          SRC_IMAGE="${REGISTRY}/${SRC_ECR_REPOSITORY}"

          DIGEST=$(aws ecr describe-images \
            --repository-name "$SRC_ECR_REPOSITORY" \
            --image-ids imageTag="$SOURCE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::Source image ${SRC_IMAGE}:${SOURCE_TAG} not found. Staging must publish it first."
            exit 1
          fi

          CONCRETE_TAG=$(aws ecr describe-images \
            --repository-name "$SRC_ECR_REPOSITORY" \
            --image-ids imageDigest="$DIGEST" \
            --query 'imageDetails[0].imageTags' --output json \
            | jq -r '.[] | select(. != "dev-latest" and . != "staging-latest" and . != "prod-latest") | .' \
            | head -n1)

          DEPLOY_TAG="${CONCRETE_TAG:-$SOURCE_TAG}"

          {
            echo "src_image=${SRC_IMAGE}"
            echo "src_registry=${REGISTRY}"
            echo "source_tag=${SOURCE_TAG}"
            echo "digest=${DIGEST}"
            echo "deploy_tag=${DEPLOY_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Pull source image by digest
        run: |
          docker pull "${{ steps.src.outputs.src_image }}@${{ steps.src.outputs.digest }}"
          docker tag  "${{ steps.src.outputs.src_image }}@${{ steps.src.outputs.digest }}" \
                      "promotion-staging:${{ steps.src.outputs.deploy_tag }}"

      # --- Destination: prod account (push) ---
      - name: Configure AWS creds (prod account - DESTINATION)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.PROD_AWS_REGION }}
          role-session-name: prod-promote-dest

      - name: Ensure prod ECR repository exists (keep last 3)
        run: |
          if ! aws ecr describe-repositories --repository-names "$PROD_ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$PROD_ECR_REPOSITORY" >/dev/null
          fi
          aws ecr put-lifecycle-policy --repository-name "$PROD_ECR_REPOSITORY" --lifecycle-policy-text '{
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the last 3 images",
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 3},
              "action": {"type": "expire"}
            }]
          }' >/dev/null

      - name: Login to prod ECR
        id: prod-login
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

      - name: Trivy scan before promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: promotion-staging:${{ steps.src.outputs.deploy_tag }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Re-tag and push to prod ECR
        id: push
        run: |
          PROD_REGISTRY="${{ steps.prod-login.outputs.registry }}"
          PROD_IMAGE="${PROD_REGISTRY}/${PROD_ECR_REPOSITORY}"
          DEPLOY_TAG="${{ steps.src.outputs.deploy_tag }}"

          docker tag "promotion-staging:${DEPLOY_TAG}" "${PROD_IMAGE}:${DEPLOY_TAG}"
          docker tag "promotion-staging:${DEPLOY_TAG}" "${PROD_IMAGE}:prod-latest"

          docker push "${PROD_IMAGE}:${DEPLOY_TAG}"
          docker push "${PROD_IMAGE}:prod-latest"

          {
            echo "prod_image=${PROD_IMAGE}"
            echo "deploy_tag=${DEPLOY_TAG}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🔄 Image Promoted to Prod ECR"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Source | \`${{ steps.src.outputs.src_image }}:${{ steps.src.outputs.source_tag }}\` |"
            echo "| Source digest | \`${{ steps.src.outputs.digest }}\` |"
            echo "| Prod image | \`${PROD_IMAGE}:${DEPLOY_TAG}\` |"
            echo "| Also tagged | \`prod-latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # PUSH: Deploy to ECS in prod account
  # =========================================================================
  deploy-ecs:
    name: 🚀 Deploy to ECS (prod)
    needs: promote-image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Configure AWS creds (prod account)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.PROD_AWS_REGION }}

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$PROD_ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@a46ec7cf1073aeef99e9f03bd1aa0f8ac85bfbcb # v1.7.5
        with:
          task-definition: task-definition.json
          container-name: ${{ env.PROD_ECS_CONTAINER }}
          image: ${{ needs.promote-image.outputs.prod_image }}:${{ needs.promote-image.outputs.deploy_tag }}

      - name: Deploy to ECS (wait for stability)
        uses: aws-actions/amazon-ecs-deploy-task-definition@d13ff2810d4bdd91b47ddfb0d4bb9ea0a71acc4e # v2.3.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.PROD_ECS_SERVICE }}
          cluster: ${{ env.PROD_ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: External health check
        if: vars.HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "$HEALTH_URL" >/dev/null; then
              echo "Healthy: ${{ needs.promote-image.outputs.deploy_tag }}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed: $HEALTH_URL"
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## 🚀 Prod Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Target | ECS \`${PROD_ECS_CLUSTER}/${PROD_ECS_SERVICE}\` |"
            echo "| Image | \`${{ needs.promote-image.outputs.prod_image }}:${{ needs.promote-image.outputs.deploy_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"