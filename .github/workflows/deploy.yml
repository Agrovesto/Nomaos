name: Build and Deploy .NET 8 Application

on:
  push:
    branches:
      - dev  # Trigger on pushes to the dev branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the application
        run: dotnet build --configuration Release --no-restore

      - name: Publish the application
        run: dotnet publish -c Release -o ./publish

      - name: Create Web Deploy Package
        run: |
          zip -r agrovesto.zip ./publish/*
          mv agrovesto.zip ./publish/agrovesto.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish/agrovesto.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Transfer package to IIS server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./publish/agrovesto.zip"
          target: "C:/inetpub/agrovesto/"

      - name: Deploy to IIS with Web Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          shell: powershell
          script: |
            & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
            -verb:sync `
            -source:package=\"C:\inetpub\agrovesto\agrovesto.zip\" `
            -dest:auto,computerName=\"localhost\",includeAcls=False `
            -allowUntrusted
            
            iisreset
