name: Build and Deploy .NET 8 Application

on:
  push:
    branches:
      - dev  # Trigger on pushes to the dev branch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the application
        run: dotnet build --configuration Release --no-restore

      - name: Publish the application
        run: dotnet publish -c Release -o ./publish

      - name: Create Web Deploy Package
        run: |
         Compress-Archive -Path ./publish/* -DestinationPath ./publish/agrovesto.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agrovesto-app
          path: ./publish/agrovesto.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: agrovesto-app
          path: ./publish

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copy artifact to EC2 instance
        run: |
          scp -i ${{ secrets.EC2_SSH_KEY }} ./publish/agrovesto.zip Administrator@${{ secrets.EC2_HOST }}:C:/inetpub/wwwroot/agrovesto.zip

      - name: Unzip and deploy to IIS
        run: |
          ssh -i ${{ secrets.EC2_SSH_KEY }} Administrator@${{ secrets.EC2_HOST }} << 'EOF'
          cd C:/inetpub/wwwroot
          Remove-Item -Recurse -Force agrovesto
          Expand-Archive -Path agrovesto.zip -DestinationPath agrovesto
          Remove-Item -Force agrovesto.zip
          iisreset
          EOF

      
