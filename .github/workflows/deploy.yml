name: Build and Deploy .NET 8 Application

on:
  push:
    branches:
      - dev  # Trigger on pushes to the dev branch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the application
        run: dotnet build --configuration Release --no-restore

      - name: Publish the application
        run: dotnet publish -c Release -o ./publish

      - name: Create Web Deploy Package
        run: |
         Compress-Archive -Path ./publish/* -DestinationPath ./publish/agrovesto.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish/agrovesto.zip

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
            
      - name: Deploy to IIS with Web Deploy
        uses: actions/upload-artifact@v4
        env:
          WEBAPP_NAME: 'agrovesto-api'
          WEBAPP_PHYSICAL_PATH: 'C:\inetpub\agrovesto'
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          & $msdeploy -verb:sync `
            -source:package="${{ github.workspace }}\publish\agrovesto.zip" `
            -dest:auto,computerName="localhost",userName=${{ secrets.EC2_USER }},password=${{ secrets.EC2_SSH_KEY }},authtype='basic',includeAcls='False' `
            -allowUntrusted

      # - name: Transfer package to IIS server
      #   uses: appleboy/scp-action@master
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     source: "./publish/agrovesto.zip"
      #     target: "C:/inetpub/agrovesto/"

      # - name: Deploy to IIS with Web Deploy
      #   uses: appleboy/ssh-action@master
