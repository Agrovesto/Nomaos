name: Build and Deploy .NET 8 App to Windows EC2

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build application
        run: dotnet build --configuration Release --no-restore
      
      - name: Publish application
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
      
      - name: Deploy to IIS
        run: |
          $dest = "C:\inetpub\wwwroot\agrovestro-api"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          Copy-Item -Path "dotnet-app\publish" -Destination $dest -Recurse
            
            # Create website
            New-Website -Name $agrovestro -Port 81 -PhysicalPath $sitePath -ApplicationPool $appPoolName
            
            # Remove existing files and copy new ones
            Remove-Item -Recurse -Force $sitePath\*
            Copy-Item -Path "C:\Users\${{ secrets.EC2_USER }}\publish\*" -Destination $sitePath -Recurse
            
            # Start IIS
            Start-Service -Name W3SVC
