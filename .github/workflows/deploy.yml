name: CI/CD Deploy Agrovesto.Backend.API

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Execute deploy script
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "PR detected: running deploy.sh in dry-run mode"
            ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s -- --dry-run' < deploy.sh
          else
            echo "Push to master: running full deployment"
            ssh ubuntu@${{ secrets.EC2_HOST }} 'bash -s' < deploy.sh
          fi
