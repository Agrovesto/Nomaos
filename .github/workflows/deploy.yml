name: CI/CD Deploy Agrovesto.Backend.API

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Setup .NET 8 SDK
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 4️⃣ Build application
      - name: Build application
        run: dotnet build -c Release --no-restore

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 1️⃣ Checkout repository (ADD THIS STEP!)
      - uses: actions/checkout@v3
      # 1️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
  
      # 2️⃣ Add EC2 host to known_hosts
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
  
      # 3️⃣ Execute deploy.sh
      - name: Execute deploy script
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "PR detected: running deploy.sh in dry-run mode"
            ssh ubuntu@"$EC2_HOST" bash -s -- --dry-run < ./deploy.sh
          else
            echo "Push to master: running full deployment"
            ssh ubuntu@"$EC2_HOST" bash -s < ./deploy.sh
          fi
