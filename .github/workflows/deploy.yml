name: Build and Deploy .NET 8 App to Windows EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build application
        run: dotnet build --configuration Release --no-restore
      
      - name: Publish application
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
      
      - name: Deploy to EC2 using WinRM
        uses: cloudbase/winrm-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          password: ${{ secrets.EC2_PASSWORD }}
          transport: ntlm
          port: 5985
          command: |
            $appPoolName = "AgroVestoAppPool"
            $siteName = "AgroVesto"
            $sitePath = "C:\inetpub\wwwroot\AgroVesto"
            
            # Stop IIS
            Stop-Service -Name W3SVC
            
            # Create application pool if it does not exist
            if (-Not (Test-Path IIS:\AppPools\$appPoolName)) {
              New-WebAppPool -Name $appPoolName
              Set-ItemProperty IIS:\AppPools\$appPoolName -Name managedRuntimeVersion -Value ""  # No .NET runtime needed for self-contained apps
            }
            
            # Remove existing website if it exists
            if (Test-Path IIS:\Sites\$siteName) {
              Remove-Website -Name $siteName
            }
            
            # Create website
            New-Website -Name $siteName -Port 80 -PhysicalPath $sitePath -ApplicationPool $appPoolName
            
            # Remove existing files and copy new ones
            Remove-Item -Recurse -Force $sitePath\*
            Copy-Item -Path "C:\Users\${{ secrets.EC2_USER }}\publish\*" -Destination $sitePath -Recurse
            
            # Start IIS
            Start-Service -Name W3SVC
