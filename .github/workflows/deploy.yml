name: Build and Deploy .NET 8 Application

on:
  push:
    branches:
      - dev  # Trigger on pushes to the dev branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up .NET 8 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # Step 3: Restore dependencies and build the application
      - name: Restore dependencies
        run: dotnet restore

      - name: Build the application
        run: dotnet build --configuration Release --no-restore

      # Step 4: Publish the application
      - name: Publish the application
        run: dotnet publish -c Release -o ./publish

      # Step 5: Upload the published artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure this job runs only if the build job succeeds

    steps:
      # Step 1: Download the published artifacts
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: dotnet-app
          path: ./publish

      # Step 2: Deploy to the Ubuntu server
      - name: Deploy to Ubuntu server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}  # Server IP or hostname
          username: ${{ secrets.EC2_USER }}  # SSH username
          key: ${{ secrets.EC2_SSH_KEY }}  # SSH private key
          source: "./publish/*"
          target: "/var/www/argovesto-api/"

      # Step 3: Restart the .NET application service
      - name: Restart .NET application service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}  # Server IP or hostname
          username: ${{ secrets.EC2_USER }}  # SSH username
          key: ${{ secrets.EC2_SSH_KEY }}  # SSH private key
          script: |
            sudo systemctl restart dotnet-app
            sudo systemctl status dotnet-app
