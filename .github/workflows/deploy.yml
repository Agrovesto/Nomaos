name: Build and Deploy .NET 8 App to Windows EC2

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # - name: Setup .NET 8
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: 8.0.x
      #     install-dir: 'C:\Programs Files\dotnet'

      - name: Set dotnet path
        run: |
          $dotnetPath = "C:\Program Files\dotnet"
          echo "Adding dotnet path to the environment variable"
          echo "$dotnetPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
     
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build application
        run: dotnet build --configuration Release --no-restore
      
      - name: Publish application
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: [self-hosted, windows]
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
      
      - name: Deploy to IIS
        run: |
          $dest = "C:\inetpub\wwwroot\agrovestro-api"
          $sitePath = "C:\inetpub\wwwroot\agrovestro-api"
          $appPoolName = "YourAppPool"  # Set the desired application pool name
          
          # Create directory if not exists
          if (!(Test-Path $dest)) {
              New-Item -ItemType Directory -Path $dest
          }
          
          # Remove existing files and copy new ones
          Remove-Item -Recurse -Force $sitePath\* -ErrorAction SilentlyContinue
          Copy-Item -Path "./publish/*" -Destination $sitePath -Recurse

          # Ensure IIS is installed and set up
          Import-Module WebAdministration

          # Create website if it doesn't exist
          if (!(Get-Website -Name "agrovestro-api")) {
            New-Website -Name "agrovestro-api" -Port 81 -PhysicalPath $sitePath -ApplicationPool $appPoolName
          }
          
          # Start IIS if not already running
          Start-Service -Name W3SVC
