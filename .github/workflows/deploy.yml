name: CI/CD Deploy Agrovesto.Backend.API

on:
  pull_request:
    branches:
      - master  # PRs targeting master branch
  push:
    branches:
      - master  # Deploy only on push to master
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
  
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up .NET SDK (for build/restore on PRs)
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore and build
      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build -c Release --no-restore

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'  # Deploy only on push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1️⃣ Set up SSH key
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 2️⃣ Copy deployment script
      - name: Copy deployment script
        run: |
          scp -o StrictHostKeyChecking=no deploy.sh ubuntu@${{ secrets.EC2_HOST }}:/tmp/deploy.sh

      # 3️⃣ Run deployment script on EC2
      - name: Execute deployment script
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "bash /tmp/deploy.sh"


