# ─────────────────────────────────────────────────────────────────────────────
# Production overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api
#
# deploy.sh picks this up automatically when COMPOSE_PROFILE=prod (or when
# /opt/nomaos/docker-compose.prod.yml exists), so the command above is what CI
# actually runs on the box.
#
# Differences from the base file: nothing about the application, everything
# about blast radius — read-only root filesystem, no new privileges, dropped
# capabilities and a hard file-descriptor/pids ceiling.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    # An immutable tag is mandatory in prod. deploy.sh exports
    # IMAGE_TAG=sha-<short_sha>; the :? makes a missing value fail loudly
    # instead of silently deploying :latest.
    image: "${ECR_REGISTRY:?}/${ECR_REPOSITORY:?}:${IMAGE_TAG:?IMAGE_TAG must be an immutable sha-<short_sha> tag in production}"

    read_only: true
    tmpfs:
      # ASP.NET Core DataProtection + the temp dir need somewhere writable.
      - /tmp:mode=1777,size=128m
    volumes:
      # Serilog's optional file sink (LOG_FILE_PATH). Host dir must be
      # chown 1654:1654 — bootstrap.sh does that.
      - /opt/nomaos/logs:/app/logs

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 512

    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.0}"
          memory: "${API_MEM_LIMIT:-2g}"
        reservations:
          memory: "${API_MEM_RESERVATION:-768m}"
