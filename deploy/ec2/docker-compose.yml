# ─────────────────────────────────────────────────────────────────────────────
# NomaOS Onboarding API — Docker Compose on EC2 (dev and prod)
#
# This is the deployment artifact. There is no ECS anywhere in this path:
#   CI builds -> pushes to ECR -> this host pulls -> compose up -> health gate.
#
# Host layout (see README.md):
#   /opt/nomaos/docker-compose.yml        this file
#   /opt/nomaos/docker-compose.prod.yml   prod overlay (optional)
#   /opt/nomaos/.env                      non-secret: ECR_REGISTRY, IMAGE_TAG, ports
#   /opt/nomaos/.env.api                  RENDERED FROM VAULT, mode 0600, never committed
#   /opt/nomaos/.env.otel                 OTEL_* block (see env.otel.example)
#   /opt/nomaos/PREVIOUS_IMAGE_TAG        rollback pointer written by deploy.sh
#
# Usage on the host (deploy.sh does all of this for you):
#   aws ecr get-login-password --region "$AWS_REGION" \
#     | docker login --username AWS --password-stdin "$ECR_REGISTRY"
#   docker compose pull api
#   docker compose up -d --no-deps --force-recreate api
# ─────────────────────────────────────────────────────────────────────────────

name: nomaos

services:
  api:
    # Always an ECR reference — the host never builds. Pin an immutable
    # sha-<short_sha> tag in .env for prod; "dev"/"prod" floating tags exist for
    # convenience only.
    image: "${ECR_REGISTRY:?ECR_REGISTRY must be set}/${ECR_REPOSITORY:?ECR_REPOSITORY must be set}:${IMAGE_TAG:-latest}"
    container_name: "${COMPOSE_SERVICE_NAME:-nomaos-api}"
    # Belt and braces: the image already declares USER 1654:1654, but pinning it
    # here means a mis-built image cannot silently start as root.
    user: "1654:1654"
    restart: unless-stopped
    pull_policy: always

    # Bind to the loopback interface by default and let the host's nginx/Caddy
    # (or the ALB target on the private IP) terminate TLS in front. Set
    # API_BIND=0.0.0.0 in .env to publish the port on all interfaces.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"

    env_file:
      # Secrets rendered from Vault (0600, root-owned). NEVER committed.
      - .env.api
      # OTEL_* block. Non-secret, safe to keep in git as env.otel.example.
      - .env.otel

    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      TZ: "${TZ:-Africa/Lagos}"
      # Surfaced by /status and stamped on every log line + span.
      GIT_SHA: "${GIT_SHA:-unknown}"
      IMAGE_TAG: "${IMAGE_TAG:-latest}"

    healthcheck:
      # Liveness only. Readiness (SQL/Redis/Vault) is the load balancer's job:
      # gating container restarts on a database blip restarts the whole fleet.
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://127.0.0.1:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: "${HEALTHCHECK_START_PERIOD:-45s}"

    # Hangfire jobs and bulk uploads need time to finish; SIGTERM reaches
    # dotnet as PID 1 (exec-form ENTRYPOINT) and Kestrel drains.
    stop_grace_period: "${STOP_GRACE_PERIOD:-30s}"

    logging:
      # JSON lines on stdout -> json-file -> Alloy's docker/file discovery -> Loki.
      # Rotation is mandatory: without it a chatty release fills the EBS volume
      # and takes SQL Server down with it.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        labels: "com.nomaos.app,com.nomaos.env,com.nomaos.commit"

    labels:
      com.nomaos.app: "nomaos-onboarding-api"
      com.nomaos.env: "${ASPNETCORE_ENVIRONMENT:-Production}"
      com.nomaos.commit: "${GIT_SHA:-unknown}"
      com.nomaos.image-tag: "${IMAGE_TAG:-latest}"
      com.nomaos.managed-by: "deploy/ec2/deploy.sh"

    deploy:
      resources:
        limits:
          memory: "${API_MEM_LIMIT:-1500m}"
        reservations:
          memory: "${API_MEM_RESERVATION:-512m}"

    networks:
      - nomaos

    # No depends_on: SQL Server is RDS and Redis is ElastiCache in every real
    # environment. The dev profile below is the only case with local sidecars,
    # and readiness (not depends_on) is what decides when traffic may flow.

  # ── dev profile only ───────────────────────────────────────────────────────
  # docker compose --profile dev up -d
  redis:
    profiles: ["dev"]
    image: redis:7.2-alpine
    container_name: nomaos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nomaos

  # ── alloy profile: agent-per-host pattern ──────────────────────────────────
  # docker compose --profile alloy up -d
  # Prefer a single host-level Alloy (systemd) when the box runs several
  # services; this container exists so a standalone EC2 box can ship signals
  # without extra provisioning. Config: ./alloy/config.alloy
  alloy:
    profiles: ["alloy"]
    image: grafana/alloy:v1.5.1
    container_name: nomaos-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to container logs + the docker socket for discovery.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - nomaos

networks:
  nomaos:
    name: nomaos
    driver: bridge

volumes:
  redis-data:
    name: nomaos-redis-data
  alloy-data:
    name: nomaos-alloy-data
