# ─────────────────────────────────────────────────────────────────────────────
# NomaOS — shared infrastructure (project: nomaos-infra)
#
#   nginx    : the edge. Blue/green flip happens by rewriting the files in
#              ./nginx/upstreams and reloading — nginx itself is never recreated.
#   mssql    : replaces the SQL Server previously installed on the EC2 host.
#   redis    : replaces the Redis previously installed on the EC2 host.
#
# Long-lived. Deployments never touch this file — app slots are separate
# compose projects that attach to the networks declared here.
#
#   docker compose -p nomaos-infra -f docker-compose.infra.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

name: nomaos-infra

networks:
  # Edge network: nginx <-> app containers. Nothing else belongs here.
  nomaos_edge:
    name: nomaos_edge
    driver: bridge
  # Data network: app containers <-> mssql/redis. Not reachable from the edge.
  nomaos_data:
    name: nomaos_data
    driver: bridge

volumes:
  mssql_data:
    name: nomaos_mssql_data
  mssql_log:
    name: nomaos_mssql_log
  mssql_backup:
    name: nomaos_mssql_backup
  redis_data:
    name: nomaos_redis_data

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Edge proxy — owns :80/:443 on the host
  # ───────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nomaos-nginx
    restart: unless-stopped
    networks:
      - nomaos_edge
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      # Consumed by the official image's envsubst templating at container start.
      # NGINX_ENVSUBST_FILTER keeps envsubst away from nginx's own $host,
      # $request_uri, $remote_addr ... variables.
      NGINX_ENVSUBST_FILTER: "^NOMAOS_"
      NOMAOS_API_SERVER_NAME: "${NOMAOS_API_SERVER_NAME:-_}"
      NOMAOS_APP2_SERVER_NAME: "${NOMAOS_APP2_SERVER_NAME:-app2.invalid}"
      NOMAOS_CLIENT_MAX_BODY_SIZE: "${NOMAOS_CLIENT_MAX_BODY_SIZE:-50m}"
      NOMAOS_PROXY_READ_TIMEOUT: "${NOMAOS_PROXY_READ_TIMEOUT:-300s}"
    volumes:
      - ../nginx/templates:/etc/nginx/templates:ro
      # Rewritten by deploy/scripts/deploy.sh on every traffic flip.
      - ${NOMAOS_STATE_DIR:-/opt/nomaos}/nginx/upstreams:/etc/nginx/upstreams:ro
      - ${NOMAOS_STATE_DIR:-/opt/nomaos}/nginx/certs:/etc/nginx/certs:ro
      - ${NOMAOS_STATE_DIR:-/opt/nomaos}/logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --timeout=3 http://127.0.0.1/__edge_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: &default_logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ───────────────────────────────────────────────────────────────────────────
  # SQL Server — was localhost,1433 on the host
  # ───────────────────────────────────────────────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nomaos-mssql
    restart: unless-stopped
    user: "0:0"
    networks:
      - nomaos_data
    ports:
      # Loopback-only: lets you run sqlcmd/SSMS through an SSH tunnel without
      # exposing 1433 to the VPC. Remove entirely to lock it down further.
      - "127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_MEMORY_LIMIT_MB: "${MSSQL_MEMORY_LIMIT_MB:-4096}"
      MSSQL_AGENT_ENABLED: "${MSSQL_AGENT_ENABLED:-true}"
      MSSQL_BACKUP_DIR: "/var/opt/mssql/backup"
      TZ: "${TZ:-UTC}"
    volumes:
      - mssql_data:/var/opt/mssql/data
      - mssql_log:/var/opt/mssql/log
      - mssql_backup:/var/opt/mssql/backup
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -No -Q "SELECT 1" -b -t 3 > /dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${MSSQL_MEM_LIMIT:-6g}
    logging: *default_logging

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — was localhost:6379 on the host
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: nomaos-redis
    restart: unless-stopped
    networks:
      - nomaos_data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - "${REDIS_MAXMEMORY:-512mb}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
      - --save
      - "900 1"
      - --save
      - "300 10"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-768m}
    logging: *default_logging
