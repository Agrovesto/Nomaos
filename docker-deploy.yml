name: Docker Build & Blue/Green Deploy

on:
  pull_request:
    branches:
      - devops
  push:
    branches:
      - master
      - devops
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to deploy"
        required: true
        default: nomaos-api
        type: choice
        options:
          - nomaos-api
      environment:
        description: "Target environment"
        required: true
        default: prod
        type: choice
        options:
          - staging
          - prod

concurrency:
  group: "docker-deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.environment || (github.ref == 'refs/heads/devops' && 'staging' || 'prod') }}-${{ inputs.app || 'nomaos-api' }}"
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: agrovesto-dev-nomaos
  APP_NAME: ${{ inputs.app || 'nomaos-api' }}
  DOTNET_SDK_VERSION: '8.0.x'

jobs:
  ##########################################################################
  # PR VALIDATION
  # Runs on PRs to devops. Checks code quality, security, and tests.
  # Does NOT build/push to ECR.
  ##########################################################################
  validate-pr:
    name: Validate Pull Request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # 1. NuGet Cache
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      # 2. Unit Tests
      - name: Run Unit Tests
        run: dotnet test --no-build --no-restore --configuration Release

      # 3. Secret Detection
      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --fail

      # 4. Trivy Code Scan (Filesystem)
      - name: Trivy Code Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # 5. Trivy Image Scan (Build temporary image for scanning)
      - name: Build Temporary Image for Trivy
        run: docker build -t nomaos-api-pr:latest .
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nomaos-api-pr:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # 6. SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        id: sonarqube-quality-gate
        continue-on-error: true

      - name: SonarQube Quality Gate Check
        if: steps.sonarqube-quality-gate.outcome != 'success'
        run: |
          echo "SonarQube quality gate failed."
          exit 1

  ##########################################################################
  # BUILD & PUSH
  # Runs on push to master/devops or workflow_dispatch.
  # Builds the Docker image and pushes it to ECR.
  ##########################################################################
  build-and-push:
    name: Build and Push Image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: []
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build with BuildKit and cache from ECR (if exists) for faster builds
          DOCKER_BUILDKIT=1 docker build \
            --cache-from type=registry,ref=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest \
            .

          # Push the immutable SHA tag and the latest tag
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

  ##########################################################################
  # DEPLOY
  # Runs after build-and-push completes successfully.
  # Pulls the image from ECR and restarts the container on EC2 via SSM.
  ##########################################################################
  deploy:
    name: Deploy via Blue/Green
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Target Instance via SSM
        id: get-instance
        run: |
          # Find the EC2 instance tagged for this app environment
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ inputs.app || 'nomaos-api' }}-${{ inputs.environment || 'prod' }}" \
            "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "Error: No running instance found for ${{ inputs.app || 'nomaos-api' }}-${{ inputs.environment || 'prod' }}"
            exit 1
          fi
          
          echo "instance_id=${INSTANCE_ID}" >> $GITHUB_OUTPUT

      - name: Deploy via SSM Session Manager
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.registry || '763104351884.dkr.ecr.eu-west-1.amazonaws.com' }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          # Use SSM to run docker commands on the remote instance
          aws ssm send-command \
            --instance-ids ${{ steps.get-instance.outputs.instance_id }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands=[
              "set -e",
              "echo 'Pulling new image...'",
              "docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}",
              "echo 'Stopping old container...'",
              "docker stop nomaos-api-${{ inputs.environment || 'prod' }} || true",
              "docker rm nomaos-api-${{ inputs.environment || 'prod' }} || true",
              "echo 'Starting new container...'",
              "docker run -d \
                --name nomaos-api-${{ inputs.environment || 'prod' }} \
                --restart unless-stopped \
                -e 'ASPNETCORE_ENVIRONMENT=${{ inputs.environment || 'prod' }}' \
                ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}",
              "echo 'Deployment complete.'"
            ]

      - name: Health Check
        run: |
          # Wait for the new container to start and become healthy
          echo "Waiting 30 seconds for startup..."
          sleep 30
          echo "Deployment successful: Image ${{ github.sha }}"